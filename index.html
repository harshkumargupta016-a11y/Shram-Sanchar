<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shram Sanchar — Consent-First Mobility Layer for eShram</title>
<meta name="theme-color" content="#0E2A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============ Design tokens & Public Service Aesthetic ============ */
:root{
  --navy:#0E2A5C; --navy-2:#173F86; --navy-3:#DCE5F5;
  --saffron:#F07D1A; --saffron-2:#FBE5D0;
  --green:#1F8A4C; --green-2:#DDF0E4;
  --red:#C62828; --red-2:#FBE0E0;
  --amber:#A66B00; --amber-2:#FFF0C7;
  --ink:#14182B; --muted:#5B6478; --line:#DDE2EE; --bg:#F5F7FB; --card:#ffffff;
  --serif:'Noto Serif','Georgia',serif;
  --sans:'Noto Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);margin:0;line-height:1.2;color:var(--navy)}
h1{font-size:clamp(1.9rem,4vw,3.1rem);letter-spacing:-.01em}
h2{font-size:clamp(1.4rem,2.6vw,2.0rem)}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--navy-2)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tri{height:5px;background:linear-gradient(90deg,var(--saffron) 0 33.3%,#ffffff 33.3% 66.6%,var(--green) 66.6%);border-bottom:1px solid var(--line)}

/* ============ Header & Navigation ============ */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-family:var(--serif);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px;stroke:#fff}
.nav-links{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links a{padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav-links a:hover{background:var(--bg);color:var(--navy)}
.nav-links a.on{color:var(--navy);background:var(--navy-3)}
.nav-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.on{background:var(--green-2);color:var(--green)}
.pill.off{background:var(--saffron-2);color:#A24E00}

/* Bottom Nav for Mobile */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:6px 0}
.bottom-nav .wrap{display:flex;justify-content:space-around}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);text-decoration:none;font-weight:600;padding:4px 8px;border-radius:var(--r-sm)}
.bottom-nav a.on{color:var(--navy);background:var(--navy-3)}
.bottom-nav svg{width:20px;height:20px}

/* ============ Buttons & Input Controls ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 18px;font-weight:600;font-size:.95rem;text-decoration:none;transition:all .15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.accent{background:var(--saffron);color:#fff}
.btn.accent:hover{background:#D96C0C}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:var(--navy);background:#fff}
.btn.danger{background:var(--red-2);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.lg{padding:14px 24px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9rem;color:var(--ink)}
input,select,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px var(--navy-3)}
textarea{resize:vertical;min-height:92px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}

/* ============ Core Components & Cards ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.panel h3{margin-bottom:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.b-Critical{background:var(--red);color:#fff}
.b-High{background:var(--saffron-2);color:#A24E00}
.b-Medium{background:var(--amber-2);color:var(--amber)}
.b-Low{background:var(--green-2);color:var(--green)}
.b-queued{background:var(--saffron-2);color:#A24E00}
.b-synced{background:var(--green-2);color:var(--green)}

/* Privacy Status Card */
.privacy-card{background:linear-gradient(135deg, #0E2A5C, #173F86);color:#fff;border-radius:var(--r-md);padding:18px;margin-bottom:20px}
.privacy-card h4{color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:1rem}
.privacy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font-size:.85rem}
.privacy-item{background:rgba(255,255,255,.1);padding:8px 12px;border-radius:var(--r-sm);display:flex;justify-content:space-between;align-items:center}
.privacy-item span{opacity:.9}
.privacy-item b{font-weight:700}

/* Data Confidence Breakdown */
.confidence-box{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;margin:16px 0}
.confidence-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.confidence-score{font-size:1.4rem;font-family:var(--serif);font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px}
.confidence-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.confidence-list li{display:flex;align-items:center;gap:8px}
.confidence-list li.check{color:var(--green)}
.confidence-list li.uncheck{color:var(--muted)}

/* Hero Section */
.hero{padding:48px 0 56px;background:radial-gradient(800px 400px at 85% -10%,rgba(240,125,26,.12),transparent 60%),#fff;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p.lead{font-size:1.1rem;color:var(--muted);margin:16px 0 24px;max-width:54ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.principle-banner{background:var(--saffron-2);border-left:4px solid var(--saffron);padding:12px 16px;border-radius:var(--r-sm);font-weight:600;color:#8A4000;margin-bottom:16px;display:flex;align-items:center;gap:10px}

/* Page Layouts */
.page{padding:28px 0 64px;min-height:72vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cols{display:grid;grid-template-columns:440px 1fr;gap:20px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px;margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:6px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}

/* Voice Interface */
.voice-box{text-align:center;padding:16px;background:var(--bg);border-radius:var(--r-md);border:1.5px dashed var(--line);margin-bottom:16px}
.micbtn{width:88px;height:88px;border-radius:50%;border:0;background:var(--saffron);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 8px 20px -6px rgba(240,125,26,.8);transition:transform .15s}
.micbtn:hover{transform:scale(1.04)}
.micbtn svg{width:38px;height:38px;stroke:#fff}
.micbtn.live{animation:pulse 1.3s infinite;background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.6)}100%{box-shadow:0 0 0 22px rgba(198,40,40,0)}}

/* Scheme Cards */
.scheme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.scheme-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.scheme-card h4{font-family:var(--sans);font-size:1.05rem;color:var(--navy);margin-bottom:6px}
.scheme-tag{font-size:.78rem;font-weight:700;color:var(--navy-2);background:var(--navy-3);padding:2px 8px;border-radius:4px;width:fit-content;margin-bottom:8px}

/* Read Aloud Button */
.read-aloud-btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy-3);color:var(--navy);border:none;padding:5px 10px;border-radius:99px;font-size:.8rem;font-weight:600;cursor:pointer;margin-top:6px}
.read-aloud-btn:hover{background:var(--navy);color:#fff}

/* Floating Ask Assistant Button */
.ask-fab{position:fixed;right:22px;bottom:22px;z-index:60;background:var(--navy);color:#fff;border:none;border-radius:99px;padding:12px 20px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;box-shadow:0 10px 25px -5px rgba(14,42,92,.6)}
.ask-fab svg{width:22px;height:22px}

/* Chat Assistant Drawer */
.chat-drawer{position:fixed;right:20px;bottom:85px;z-index:60;width:min(400px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:#fff;border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;box-shadow:0 20px 50px -15px rgba(14,42,92,.5);overflow:hidden}
.chat-drawer header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-drawer .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.45}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

/* Modals & Toasts */
.overlay{position:fixed;inset:0;background:rgba(10,20,45,.6);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:var(--r-md);padding:22px;width:min(500px,100%);max-height:92vh;overflow:auto}
.toasts{position:fixed;left:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 100px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:.9rem;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}

/* Footer */
footer.gov{background:var(--navy);color:#DCE5F5;padding:48px 0 28px;margin-top:40px}
footer.gov h3{color:#fff;margin-bottom:14px}
.helplines{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:30px}
.hl{background:rgba(255,255,255,.08);border-radius:var(--r-sm);padding:12px 14px;border-left:3px solid var(--saffron)}
.hl b{display:block;font-family:var(--serif);font-size:1.3rem;color:#fff}
.hl a{color:#fff;text-decoration:none}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 24px;margin-bottom:24px}
.links a{color:#DCE5F5;text-decoration:none;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:.9rem;display:flex;justify-content:space-between}

@media (max-width:900px){
  .hero .wrap,.cols,.cols.even{grid-template-columns:1fr}
  .bottom-nav{display:block}
  body{padding-bottom:60px}
}
</style>

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =====================================================================
   Small Utilities
   ===================================================================== */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtTime = (t) => new Date(t).toLocaleString("en-IN", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const net = { forced: false };
const isOnline = () => navigator.onLine && !net.forced;

const speak = (text, lang = "hi-IN") => {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      window.speechSynthesis.speak(u);
    }
  } catch (e) {
    console.warn("Speech error:", e);
  }
};

/* =====================================================================
   IndexedDB Offline Storage
   ===================================================================== */
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open("shram-sanchar-v2", 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    ["queue","checkins","complaints"].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:"id" }); });
  };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
let _db; const getDB = () => _db || (_db = openDB());
const tx = async (store, mode, fn) => {
  const d = await getDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
  });
};
const DB = {
  all: (s) => tx(s, "readonly", st => st.getAll()),
  get: (s, id) => tx(s, "readonly", st => st.get(id)),
  put: (s, v) => tx(s, "readwrite", st => st.put(v)),
  del: (s, id) => tx(s, "readwrite", st => st.delete(id)),
};

async function syncQueue() {
  if (!isOnline()) return 0;
  const q = await DB.all("queue"); let n = 0;
  for (const item of q) {
    const exists = await DB.get("checkins", item.id);
    if (!exists) {
      // Call mock eShram server endpoint
      try {
        await fetch('/api/eshram/mobility-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });
      } catch (e) {}
      await DB.put("checkins", { ...item, status:"synced", syncedAt:Date.now() });
      n++;
    }
    await DB.del("queue", item.id);
  }
  return n;
}

/* =====================================================================
   Backend API Calls (Gemini Integration)
   ===================================================================== */
async function callAiAssistant(prompt, history = [], user = null, lang = 'hi-IN') {
  try {
    const res = await fetch('/api/ai/assistant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, history, user, lang })
    });
    if (!res.ok) throw new Error('API server error');
    const data = await res.json();
    return data.reply || "Sorry, I could not generate an answer right now.";
  } catch (e) {
    return "Call eShram helpline 14434 or try again when online.";
  }
}

async function callExtractIntent(text) {
  try {
    const res = await fetch('/api/ai/extract-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    return data.data;
  } catch (e) {
    return {
      intent: "MOBILITY_UPDATE",
      destination: "Unspecified Location",
      occupation: "Unspecified Work",
      status: "Traveling",
      confidence: 0.65
    };
  }
}

async function callRecommendScheme(text) {
  try {
    const res = await fetch('/api/ai/recommend-scheme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    return data.data;
  } catch (e) {
    return { category: "Financial Support", explanation: "Default category", suggested_schemes: [] };
  }
}

/* =====================================================================
   Data Confidence Score Calculator
   ===================================================================== */
function calculateDataConfidence({ workerConfirmed, locationAvailable, aiExtracted, userModified, validTimestamp }) {
  let score = 0;
  const breakdown = [];

  if (workerConfirmed) { score += 30; breakdown.push({ text: "Worker confirmed information", val: "+30", pass: true }); }
  else { breakdown.push({ text: "Worker confirmed information", val: "0", pass: false }); }

  if (locationAvailable) { score += 25; breakdown.push({ text: "Location available (GPS consent)", val: "+25", pass: true }); }
  else { breakdown.push({ text: "Location unavailable (Manual report)", val: "0", pass: false }); }

  if (aiExtracted) { score += 20; breakdown.push({ text: "AI intent successfully extracted", val: "+20", pass: true }); }
  else { breakdown.push({ text: "AI intent extracted", val: "0", pass: false }); }

  if (userModified !== undefined) {
    score += 15;
    breakdown.push({ text: "Worker reviewed AI interpretation", val: "+15", pass: true });
  }

  if (validTimestamp) { score += 10; breakdown.push({ text: "Valid timestamp & device verified", val: "+10", pass: true }); }

  return { score: Math.min(score, 100), breakdown };
}

/* =====================================================================
   App Router & Global State
   ===================================================================== */
const AppCtx = React.createContext();
const useApp = () => React.useContext(AppCtx);
const parseHash = () => (location.hash.replace(/^#\/?/, "") || "home");
const go = (r) => { location.hash = "#/" + r; window.scrollTo({ top:0 }); };

const PATHS = {
  mic:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  wifioff:'<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
  volume:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v8h20v-8a2 2 0 0 0-2-2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',

/* Leaflet Map Component */
function MapView({ markers, lines = [], height = 340 }) {
  const el = useRef(); const map = useRef(); const layer = useRef();
  useEffect(() => {
    map.current = L.map(el.current, { scrollWheelZoom:false }).setView([22.5, 79], 4.6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18, attribution:"© OpenStreetMap" }).addTo(map.current);
    layer.current = L.layerGroup().addTo(map.current);
    setTimeout(() => map.current && map.current.invalidateSize(), 150);
    return () => { if (map.current) { map.current.remove(); map.current = null; } };
  }, []);
  const sig = JSON.stringify([markers.map(m => [m.lat, m.lng, m.color, m.popup]), lines]);
  useEffect(() => {
    const g = layer.current; if (!g) return; g.clearLayers();
    lines.forEach(l => L.polyline(l.points, { color:l.color || "#0E2A5C", weight:3, dashArray:"6 8", opacity:.7 }).addTo(g));
    markers.forEach(m => L.circleMarker([m.lat, m.lng], { radius:m.r || 9, color:"#fff", weight:2, fillColor:m.color, fillOpacity:1 }).bindPopup(m.popup).addTo(g));
    if (markers.length) map.current.fitBounds(L.latLngBounds(markers.map(m => [m.lat, m.lng])), { padding:[30, 30], maxZoom:9 });
  }, [sig]);
  return <div ref={el} style={{ height, borderRadius:'var(--r-md)', border:'1px solid var(--line)' }} />;
}

function Login({ next }) {
  const { setUser, toast, openAssistant } = useApp();

  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const sendOtp = (e) => {
    e.preventDefault(); setErr("");
    if (f.name.trim().length < 2) return setErr("Enter your full name.");
    if (!/^\d{12}$/.test(f.uan)) return setErr("UAN must be exactly 12 digits.");
    if (!/^[6-9]\d{9}$/.test(f.mobile)) return setErr("Enter a valid 10-digit mobile number.");
    setStep(2);
    toast("Demo OTP: 123456");
  };

  const verify = (e) => {
    e.preventDefault();
    if (f.otp !== "123456") return setErr("Wrong OTP. For demo use 123456.");
    const u = { role:"citizen", name:f.name.trim(), uan:f.uan, mobile:f.mobile };

  return <div className="page"><div className="wrap"><div className="cols even" style={{ maxWidth: 880, margin: '0 auto' }}>

      </form>}

      {step === 2 && <form onSubmit={verify}>
        <p className="muted small">Enter 6-digit OTP sent to {f.mobile} (Demo: <b>123456</b>)</p>
        <div className="field" style={{ marginTop: 10 }}><label>OTP Code</label><input inputMode="numeric" maxLength={6} value={f.otp} onChange={set("otp")} autoFocus /></div>

/* =====================================================================
   4. Mobility Update Flow & Confidence Score
   ===================================================================== */
function WorkerDashboard() {
  const { user, data, reload, online, sim, setSim, toast } = useApp();
  const [step, setStep] = useState("INIT"); // INIT -> CONSENT -> INPUT -> CONFIRM -> SAVED
  const [consentGranted, setConsentGranted] = useState(false);
  const [speechText, setSpeechText] = useState("");
  const [listening, setListening] = useState(false);
  const [busy, setBusy] = useState(false);
  const [aiExtraction, setAiExtraction] = useState(null);
  const [userEdited, setUserEdited] = useState(false);
  const [locationData, setLocationData] = useState(null);

  const mine = data.checkins.concat(data.queue).filter(x => x.uan === user.uan).sort((a,b) => b.createdAt - a.createdAt);
  const lastUpdate = mine[0];

  const startVoiceInput = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast("Speech input requires Chrome or Edge. Please type your update.");
    if (listening) return;
    
    const r = new SR(); r.lang = "hi-IN"; r.interimResults = true;
    r.onresult = (e) => {
      let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      setSpeechText(t);
    };
    r.onerror = (e) => { setListening(false); toast("Voice input error: " + e.error); };
    r.onend = () => { setListening(false); };
    r.start(); setListening(true);
  };

  const handleProcessMobility = async () => {
    if (!speechText.trim()) return toast("Please speak or type your update first.");
    setBusy(true);
    const extracted = await callExtractIntent(speechText);
    setAiExtraction(extracted);
    setBusy(false);
    setStep("CONFIRM");
  };

  const handleRequestConsentAndLocation = () => {
    if (navigator.geolocation) {
      toast("Requesting location once...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setLocationData({ lat: +pos.coords.latitude.toFixed(2), lng: +pos.coords.longitude.toFixed(2) });
          setConsentGranted(true);
          toast("Location access granted for this update.");
          setStep("INPUT");
        },
        () => {
          setConsentGranted(false);
          toast("Location permission denied. Continuing without GPS.");
          setStep("INPUT");
        },
        { timeout: 8000 }
      );
    } else {
      setConsentGranted(false);
      setStep("INPUT");
    }
  };

  const handleFinalConfirm = async () => {
    setBusy(true);
    const confidenceCalc = calculateDataConfidence({
      workerConfirmed: true,
      locationAvailable: !!locationData,
      aiExtracted: !!aiExtraction,
      userModified: userEdited,
      validTimestamp: true
    });

    const record = {
      id: uid(),
      uan: user.uan,
      name: user.name,
      destination: aiExtraction.destination || "Surat, Gujarat",
      occupation: aiExtraction.occupation || "Construction Worker",
      status: aiExtraction.status || "Traveling",
      transcript: speechText,
      lat: locationData?.lat || 21.17,
      lng: locationData?.lng || 72.83,
      gpsConsent: consentGranted,
      confidenceScore: confidenceCalc.score,
      confidenceBreakdown: confidenceCalc.breakdown,
      createdAt: Date.now(),
      syncStatus: isOnline() ? "synced" : "queued"
    };

    if (isOnline()) {
      await DB.put("checkins", { ...record, status: "synced" });
      toast("🟢 Online: Mobility update synchronized successfully!");
    } else {
      await DB.put("queue", { ...record, status: "queued" });
      toast("🔴 Offline Mode: Saved locally on device — Queued for Sync.");
    }

    await reload();
    setBusy(false);
    setStep("INIT");
    setSpeechText("");
    setAiExtraction(null);
    setLocationData(null);
  };

  return <div className="page"><div className="wrap">
    {/* Header & Dashboard Summary */}
    <div className="page-head">
      <div>
        <h2>Welcome, {user.name}</h2>
        <p className="muted">UAN: {user.uan} · eShram Mobility Portal</p>
      </div>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <span className={"pill " + (isOnline() ? "on" : "off")}>
          {isOnline() ? "🟢 Online" : "🔴 Offline Mode"}
        </span>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: '.85rem' }}>
          Simulate Offline:
          <input type="checkbox" checked={sim} onChange={(e) => setSim(e.target.checked)} />
        </label>
      </div>
    </div>

    {/* Privacy Protection Card */}
    <div className="privacy-card">
      <h4><Icon n="shield" /> Privacy Protection Active</h4>
      <div className="privacy-grid">
        <div className="privacy-item"><span>Continuous Tracking:</span> <b>OFF</b></div>
        <div className="privacy-item"><span>Background GPS:</span> <b>OFF</b></div>
        <div className="privacy-item"><span>Worker Confirmed Updates:</span> <b>{mine.length}</b></div>
        <div className="privacy-item"><span>Location Read:</span> <b>Only when permitted</b></div>
      </div>
    </div>

    <div className="cols">
      <div className="stack">
        {/* Step 1: Init Button */}
        {step === "INIT" && <div className="panel" style={{ textAlign: 'center', padding: 32 }}>
          <h3>🎙️ Update My Mobility</h3>
          <p className="muted" style={{ margin: '12px 0 20px' }}>
            Report where you are moving for work. Simple, voluntary, and voice-enabled.
          </p>
          <button className="btn accent lg" onClick={() => setStep("CONSENT")}>
            Start Mobility Update
          </button>
        </div>}

        {/* Step 2: Clear Consent Notice */}
        {step === "CONSENT" && <div className="panel">
          <h3>Location Consent Notice</h3>
          <p style={{ margin: '12px 0', fontSize: '.95rem' }}>
            "Your location will be used only for this mobility update. We do not continuously track your location."
          </p>
          <div className="row" style={{ marginTop: 20 }}>
            <button className="btn primary" onClick={handleRequestConsentAndLocation}>
              Allow for this update
            </button>
            <button className="btn ghost" onClick={() => setStep("INPUT")}>
              Continue without location
            </button>
            <button className="btn danger" onClick={() => setStep("INIT")}>Cancel</button>
          </div>
        </div>}

        {/* Step 3 & 4: Voice / Text Input */}
        {step === "INPUT" && <div className="panel">
          <h3>Step 2: Speak or Type Your Update</h3>
          <p className="muted small" style={{ marginBottom: 12 }}>
            Example: "I am going to Surat for construction work." / "मैं सूरत जा रहा हूँ, निर्माण काम के लिए"
          </p>
          
          <div className="voice-box">
            <button className={"micbtn " + (listening ? "live" : "")} onClick={startVoiceInput}>
              <Icon n="mic" />
            </button>
            <p className="small muted">{listening ? "Listening... speak now" : "Tap to speak"}</p>
          </div>

          <div className="field">
            <textarea value={speechText} onChange={(e) => setSpeechText(e.target.value)} placeholder="Type or speak here..." />
          </div>

          <div className="row">
            <button className="btn ghost" onClick={() => setStep("INIT")}>Cancel</button>
            <button className="btn primary" disabled={busy || !speechText.trim()} onClick={handleProcessMobility}>
              {busy ? "Understanding..." : "Extract Intent & Review"}
            </button>
          </div>
        </div>}

        {/* Step 5 & 6: AI Intent Confirmation */}
        {step === "CONFIRM" && aiExtraction && <div className="panel">
          <h3>"Did we understand you correctly?"</h3>
          <p className="muted small" style={{ marginBottom: 14 }}>
            AI extracted structured intent from your statement. Please review before saving.
          </p>

          <div className="field">
            <label>Destination City & State</label>
            <input value={aiExtraction.destination} onChange={(e) => { setAiExtraction({...aiExtraction, destination: e.target.value}); setUserEdited(true); }} />
          </div>

          <div className="field">
            <label>Work / Occupation</label>
            <input value={aiExtraction.occupation} onChange={(e) => { setAiExtraction({...aiExtraction, occupation: e.target.value}); setUserEdited(true); }} />
          </div>

          <div className="field">
            <label>Status</label>
            <select value={aiExtraction.status} onChange={(e) => { setAiExtraction({...aiExtraction, status: e.target.value}); setUserEdited(true); }}>
              <option value="Traveling">Traveling for work</option>
              <option value="Arrived">Arrived at site</option>
              <option value="Returning home">Returning home</option>
              <option value="Seeking work">Seeking work</option>
            </select>
          </div>

          {/* Data Confidence Calculation */}
          {(() => {
            const conf = calculateDataConfidence({
              workerConfirmed: true,
              locationAvailable: !!locationData,
              aiExtracted: !!aiExtraction,
              userModified: userEdited,
              validTimestamp: true
            });
            return <div className="confidence-box">
              <div className="confidence-header">
                <span>Data Confidence Score:</span>
                <span className="confidence-score">📊 {conf.score}%</span>
              </div>
              <ul className="confidence-list">
                {conf.breakdown.map((b, i) => <li key={i} className={b.pass ? "check" : "uncheck"}>
                  {b.pass ? "✓" : "○"} {b.text} ({b.val})
                </li>)}
              </ul>
            </div>;
          })()}

          <div className="row" style={{ marginTop: 16 }}>
            <button className="btn ghost" onClick={() => setStep("INPUT")}>✎ EDIT STATEMENT</button>
            <button className="btn accent lg" disabled={busy} onClick={handleFinalConfirm}>
              {busy ? "Saving..." : "✓ YES, CONFIRM UPDATE"}
            </button>
          </div>
        </div>}
      </div>

      {/* History & Status Column */}
      <div className="stack">
        <div className="panel">
          <h3>Last Worker-Confirmed Update</h3>
          {lastUpdate ? (
            <div style={{ marginTop: 10 }}>
              <p><b>Destination:</b> {lastUpdate.destination}</p>
              <p><b>Work:</b> {lastUpdate.occupation}</p>
              <p><b>Status:</b> {lastUpdate.status}</p>
              <p><b>Data Confidence:</b> {lastUpdate.confidenceScore || 85}%</p>
              <p><b>Sync Status:</b> <span className={"badge b-" + (lastUpdate.status === "synced" || lastUpdate.syncStatus === "synced" ? "synced" : "queued")}>
                {lastUpdate.status === "synced" || lastUpdate.syncStatus === "synced" ? "Synced to eShram" : "Queued on Device"}
              </span></p>
              <p className="small muted" style={{ marginTop: 6 }}>Updated: {fmtTime(lastUpdate.createdAt)}</p>
            </div>
          ) : (
            <p className="muted small" style={{ marginTop: 10 }}>No updates submitted yet.</p>
          )}
        </div>

        <div className="panel">
          <h3>Mobility Timeline</h3>
          {mine.length === 0 ? <p className="muted small">No check-ins available.</p> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 10 }}>

  { id: 5, category: "Employment", name: "eShram Job Matching & NCS Portal", desc: "National Career Service integration connecting workers with verified employers across India.", benefit: "Direct job opportunities", forWho: "Migrant job seekers", url: "https://www.ncs.gov.in" },
  { id: 6, category: "Skill Development", name: "PM Kaushal Vikas Yojana (PMKVY)", desc: "Free skill training and certification to increase employability and wage potential.", benefit: "Free certified skill training", forWho: "Youth and construction workers", url: "https://www.pmkvyofficial.org" }
];

function GovernmentSchemes() {
  const [selectedCat, setSelectedCat] = useState("All");
  const [voiceQuery, setVoiceQuery] = useState("");
  const [aiRecommendation, setAiRecommendation] = useState(null);
  const [busy, setBusy] = useState(false);

  const categories = ["All", "Financial Support", "Health", "Housing", "Employment", "Skill Development", "Pension"];

  const handleSchemeVoiceSearch = async () => {
    if (!voiceQuery.trim()) return;
    setBusy(true);
    const result = await callRecommendScheme(voiceQuery);
    setAiRecommendation(result);
    if (result.category) setSelectedCat(result.category);
    setBusy(false);
  };

  const filtered = selectedCat === "All" ? SCHEMES : SCHEMES.filter(s => s.category === selectedCat);

  return <div className="page"><div className="wrap">
    <div className="page-head">
      <div>
        <h2>🏛️ Government Schemes</h2>
        <p className="muted">Explore official government welfare and social security programs for migrant workers.</p>
      </div>
    </div>

    {/* Voice Search for Schemes */}
    <div className="panel" style={{ marginBottom: 20, background: 'var(--navy-3)' }}>
      <h3>🎙️ Ask AI about Schemes</h3>
      <p className="muted small" style={{ marginBottom: 10 }}>Say something like: "Mujhe pension chahiye" or "Bimari ke liye medical insurance"</p>
      <div className="row">
        <input value={voiceQuery} onChange={e => setVoiceQuery(e.target.value)} placeholder="Type or ask about schemes..." />
        <button className="btn primary" onClick={handleSchemeVoiceSearch} disabled={busy}>
          {busy ? "Finding..." : "Find Schemes"}
        </button>
      </div>
      {aiRecommendation && <div style={{ marginTop: 12, padding: 10, background: '#fff', borderRadius: 'var(--r-sm)' }}>
        <b>Suggested Category: {aiRecommendation.category}</b>
        <p className="small muted">{aiRecommendation.explanation}</p>
      </div>}
    </div>

    {/* Category Tabs */}
    <div className="tabs">
      {categories.map(c => <button key={c} className={selectedCat === c ? "on" : ""} onClick={() => setSelectedCat(c)}>{c}</button>)}
    </div>

    {/* Scheme Cards */}
    <div className="scheme-grid">
      {filtered.map(s => <div key={s.id} className="scheme-card">
        <div>
          <span className="scheme-tag">{s.category}</span>
          <h4>{s.name}</h4>
          <p className="muted small" style={{ margin: '8px 0' }}>{s.desc}</p>
          <p className="small"><b>For:</b> {s.forWho}</p>
          <p className="small"><b>Benefit:</b> {s.benefit}</p>
        </div>
        <div style={{ marginTop: 16, borderTop: '1px solid var(--line)', paddingTop: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <a className="btn ghost sm" href={s.url} target="_blank" rel="noopener">Visit Official Website ↗</a>
          <ReadAloud text={`${s.name}. ${s.desc}. Benefit: ${s.benefit}`} />
        </div>
      </div>)}
    </div>

    <p className="muted small" style={{ marginTop: 24, textAlign: 'center' }}>
      Disclaimer: You may be eligible for these schemes. Please check official criteria on government portals before applying.
    </p>
  </div></div>;
}

/* =====================================================================
   Root App Component & Floating Assistant
   ===================================================================== */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem("ss_user") || "null"); } catch { return null; } });
  const [data, setData] = useState({ queue:[], checkins:[], complaints:[] });
  const [sim, setSimState] = useState(false);
  const [netOn, setNetOn] = useState(navigator.onLine);
  const [toasts, setToasts] = useState([]);
  
  // Chat Drawer State
  const [chatOpen, setChatOpen] = useState(false);
  const [chatMsgs, setChatMsgs] = useState([{ role:"bot", text:"Namaste! I am Shram Sahayak. How can I help you today?" }]);
  const [chatInput, setChatInput] = useState("");
  const [chatBusy, setChatBusy] = useState(false);

  const online = netOn && !sim;

  const reload = useCallback(async () => {
    const [queue, checkins, complaints] = await Promise.all([DB.all("queue"), DB.all("checkins"), DB.all("complaints")]);
    setData({ queue, checkins, complaints });
  }, []);

  const toast = useCallback((m) => {
    const id = uid(); setToasts(t => [...t, { id, m }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200);
  }, []);

  const setSim = (v) => {
    net.forced = v; setSimState(v);
    toast(v ? "Simulating Offline Mode" : "Online Mode Restored");
  };

  const logout = () => {
    localStorage.removeItem("ss_user");
    setUser(null);
    go("home");
  };

  useEffect(() => {
    reload();
    const h = () => setRoute(parseHash());
    addEventListener("hashchange", h);
    const on = () => setNetOn(true), off = () => setNetOn(false);
    addEventListener("online", on); addEventListener("offline", off);
    return () => { removeEventListener("hashchange", h); removeEventListener("online", on); removeEventListener("offline", off); };
  }, []);

  const openAssistant = (initialPrompt) => {
    setChatOpen(true);
    if (initialPrompt) {
      sendChatMessage(initialPrompt);
    }
  };

  const sendChatMessage = async (text) => {
    const query = (text || chatInput).trim();
    if (!query || chatBusy) return;
    
    setChatInput("");
    const newMsgs = [...chatMsgs, { role: "me", text: query }];
    setChatMsgs(newMsgs);
    setChatBusy(true);

    const reply = await callAiAssistant(query, newMsgs, user, "hi-IN");
    setChatMsgs([...newMsgs, { role: "bot", text: reply }]);
    setChatBusy(false);
  };

  let page;
  if (route === "home") page = <Home />;
  else if (route === "login") page = <Login />;
  else if (route === "worker") page = user ? <WorkerDashboard /> : <Login next="worker" />;
  else if (route === "schemes") page = <GovernmentSchemes />;
  else if (route === "help") page = <HelpCentre />;
  else if (route === "jobs") page = <HelpCentre />;
  else if (route === "admin") page = <AdminDashboard />;
  else page = <Home />;

  return <AppCtx.Provider value={{ user, setUser, logout, data, reload, online, sim, setSim, toast, openAssistant }}>
    <Nav route={route} />
    {page}
    <GovFooter />

    {/* Floating Ask Assistant Button */}
    <button className="ask-fab" onClick={() => setChatOpen(!chatOpen)}>
      🎙️ Ask Assistant
    </button>

    {/* Chat Assistant Drawer */}
    {chatOpen && <div className="chat-drawer">
      <header>
        <b>🎙️ Shram Sahayak (AI Assistant)</b>
        <button style={{ background:'none', border:'none', color:'#fff', cursor:'pointer' }} onClick={() => setChatOpen(false)}>✕</button>
      </header>
      <div className="msgs">
        {chatMsgs.map((m, i) => <div key={i} className={"msg " + m.role}>
          {m.text}
          {m.role === "bot" && <ReadAloud text={m.text} />}
        </div>)}
        {chatBusy && <div className="msg bot">Thinking...</div>}
      </div>
      <form style={{ display:'flex', padding: 10, gap: 6, borderTop:'1px solid var(--line)' }} onSubmit={e => { e.preventDefault(); sendChatMessage(); }}>
        <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Ask anything..." />
        <button className="btn primary sm" disabled={chatBusy}>Send</button>
      </form>
    </div>}

    <div className="toasts">{toasts.map(t => <div className="toast" key={t.id}>{t.m}</div>)}</div>
  </AppCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
