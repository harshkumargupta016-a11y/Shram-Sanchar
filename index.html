      </div>
      {err && <p className="err">{err}</p>}
      <p className="small muted" style={{ marginBottom:10 }}>After registration, Gemini AI will automatically compute a trust score based on your profile. An admin will review and verify your account before you can post jobs.</p>
      <button className="btn primary" style={{ width:"100%" }} disabled={busy}>{busy ? "Registering…" : "Register as contractor"}</button>
    </form>}
  </div></div></div>;
}

/* =====================================================================
   Contractor Dashboard
   ===================================================================== */
function ContractorDashboard() {
  const { user, toast } = useApp();
  const [tab, setTab] = useState("jobs");
  const [jobs, setJobs] = useState([]);
  const [loadingJobs, setLoadingJobs] = useState(true);
  const [posting, setPosting] = useState(false);
  const [jf, setJf] = useState({ title:"", jobType:"Construction", city:"", state:user?.state || "GJ", wage:"", vacancies:1, description:"", startDate:"" });
  const setJ = k => e => setJf({ ...jf, [k]: e.target.value });
  const [err, setErr] = useState("");

  const loadJobs = async () => {
    setLoadingJobs(true);
    try {
      const res = await fetch("/api/jobs/by-contractor/" + user.contractorId);
      const d = await res.json();
      setJobs(d.jobs || []);
    } catch {}
    setLoadingJobs(false);
  };

  useEffect(() => { loadJobs(); }, []);

  const postJob = async (e) => {
    e.preventDefault(); setErr(""); setPosting(true);
    try {
      const res = await fetch("/api/jobs/post", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ ...jf, contractorId: user.contractorId }) });
      const d = await res.json();
      if (!res.ok) { setErr(d.error || "Failed to post job."); setPosting(false); return; }
      toast("Job alert posted: " + d.job.title);
      setJf({ title:"", jobType:"Construction", city:"", state:"GJ", wage:"", vacancies:1, description:"", startDate:"" });
      loadJobs();
      setTab("jobs");
    } catch { setErr("Network error."); }
    setPosting(false);
  };

  const ctr = user;

  return <div className="page"><div className="wrap">
    <div className="page-head">
      <div>
        <h2>Contractor Dashboard</h2>
        <p>{ctr.company} · {ctr.city}{ctr.state ? ", " + ctr.state : ""}
          &nbsp;{ctr.verified
            ? <span className="verified-chip">✓ Verified</span>
            : <span className="unverified-chip">⏳ Pending admin verification</span>}
        </p>
      </div>
      <TrustBadge level={ctr.trustLevel} score={ctr.trustScore} />
    </div>

    {!ctr.verified && <div className="hint" style={{ marginBottom:18 }}>
      ⏳ Your account is <b>pending admin verification</b>. You will be able to post job alerts once verified. In the meantime, you can explore the dashboard. Demo verified accounts: mobile 9876543210 or 9001234567.
    </div>}

    {ctr.trustReason && <div className="panel" style={{ marginBottom:16, padding:"12px 16px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
        <b style={{ fontSize:".9rem" }}>Gemini Trust Score:</b>
        <TrustBadge level={ctr.trustLevel} score={ctr.trustScore} />
        <div className="trust-bar-wrap" style={{ minWidth:120 }}>
          <div className={"trust-bar-fill trust-" + (ctr.trustLevel || "low").toLowerCase()} style={{ width: (ctr.trustScore || 0) + "%" }} />
        </div>
        <span className="small muted" style={{ flex:1, minWidth:120 }}>{ctr.trustReason}</span>
      </div>
      {ctr.trustFlags && ctr.trustFlags.length > 0 && <div className="small muted" style={{ marginTop:6 }}>⚠ Flags: {ctr.trustFlags.join(" · ")}</div>}
    </div>}

    <div className="tabs">{[["jobs","My Job Alerts"],["post","Post New Job Alert"]].map(([k, l]) => <button key={k} className={tab === k ? "on" : ""} onClick={() => { setTab(k); setErr(""); }}>{l}</button>)}</div>

    {tab === "jobs" && <div>
      {loadingJobs ? <p className="muted">Loading…</p> : jobs.length === 0
        ? <div className="empty panel">No job alerts posted yet. Use the "Post New Job Alert" tab to add one.</div>
        : <div className="stack">{jobs.map(j => <JobCard key={j.id} job={j} highlight={false} />)}</div>}
    </div>}

    {tab === "post" && <div style={{ maxWidth:560 }}>
      {!ctr.verified && <div className="hint">You must be verified by admin to post jobs.</div>}
      <form onSubmit={postJob} className="panel">
        <h3 style={{ marginBottom:14 }}>New Job Alert</h3>
        <div className="field"><label htmlFor="jp-title">Job title *</label><input id="jp-title" value={jf.title} onChange={setJ("title")} placeholder="e.g. Mason, Harvest Worker, Factory Helper" required /></div>
        <div className="row">
          <div className="field"><label htmlFor="jp-type">Job type *</label><select id="jp-type" value={jf.jobType} onChange={setJ("jobType")}>{JOB_TYPES.map(t => <option key={t}>{t}</option>)}</select></div>
          <div className="field"><label htmlFor="jp-vac">Vacancies</label><input id="jp-vac" type="number" min={1} value={jf.vacancies} onChange={setJ("vacancies")} /></div>
        </div>
        <div className="row">
          <div className="field"><label htmlFor="jp-city">City *</label><input id="jp-city" value={jf.city} onChange={setJ("city")} placeholder="e.g. Surat" required /></div>
          <div className="field"><label htmlFor="jp-st">State *</label><select id="jp-st" value={jf.state} onChange={setJ("state")}>{STATES_LIST.map(([n, c]) => <option key={c} value={c}>{n}</option>)}</select></div>
        </div>
        <div className="row">
          <div className="field"><label htmlFor="jp-wage">Daily wage / salary</label><input id="jp-wage" value={jf.wage} onChange={setJ("wage")} placeholder="e.g. ₹600/day or ₹12,000/month" /></div>
          <div className="field"><label htmlFor="jp-date">Start date</label><input id="jp-date" type="date" value={jf.startDate} onChange={setJ("startDate")} /></div>
        </div>
        <div className="field"><label htmlFor="jp-desc">Description</label><textarea id="jp-desc" value={jf.description} onChange={setJ("description")} placeholder="Skills required, accommodation, food, transport, contact info…" /></div>
        {err && <p className="err">{err}</p>}
        <button className="btn accent" disabled={posting || !ctr.verified}>{posting ? "Posting…" : "Post job alert"}</button>
      </form>
    </div>}
  </div></div>;
}

/* =====================================================================
   Worker Job Alerts (personalised feed for logged-in citizen)
   ===================================================================== */
function JobAlertsPage() {
  const { user } = useApp();
  const [jobs, setJobs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState({ state:"", city:"", jobType:"" });

  const load = async () => {
    setLoading(true);
    try {
      const params = new URLSearchParams();
      // Default to last known worker destination if available
      const dest = filter.state || (user && user.uan ? "" : "");
      if (filter.state) params.set("state", filter.state);
      if (filter.city) params.set("city", filter.city);
      if (filter.jobType) params.set("jobType", filter.jobType);
      const res = await fetch("/api/jobs/alerts?" + params.toString());
      const d = await res.json();
      setJobs(d.jobs || []);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { load(); }, [filter.state, filter.city, filter.jobType]);

  // Auto-fill location from last check-in if we can read it
  useEffect(() => {
    (async () => {
      try {
        const checkins = await DB.all("checkins");
        const mine = checkins.filter(c => c.uan === user?.uan).sort((a, b) => b.createdAt - a.createdAt);
        if (mine.length && !filter.state) {
          setFilter(f => ({ ...f, state: mine[0].state || "", city: mine[0].destination || "" }));
        }
      } catch {}
    })();
  }, []);

  const matched = jobs.filter(j => j.relevanceScore > 0);
  const other   = jobs.filter(j => j.relevanceScore === 0);

  return <div className="page"><div className="wrap">
    <div className="page-head">
      <div><h2>Job Alerts</h2><p>Personalised job openings from verified contractors — matched to your location.</p></div>
    </div>

    <div className="panel" style={{ marginBottom:16 }}>
      <div className="row" style={{ margin:0 }}>
        <div className="field" style={{ margin:0 }}><label>Filter by state</label>
          <select value={filter.state} onChange={e => setFilter({ ...filter, state: e.target.value })}>
            <option value="">All states</option>{STATES_LIST.map(([n, c]) => <option key={c} value={c}>{n} ({c})</option>)}
          </select></div>
        <div className="field" style={{ margin:0 }}><label>City (keyword)</label>
          <input value={filter.city} onChange={e => setFilter({ ...filter, city: e.target.value })} placeholder="e.g. Surat" /></div>
        <div className="field" style={{ margin:0 }}><label>Job type</label>
          <select value={filter.jobType} onChange={e => setFilter({ ...filter, jobType: e.target.value })}>
            <option value="">All types</option>{JOB_TYPES.map(t => <option key={t}>{t}</option>)}
          </select></div>
      </div>
    </div>

    {loading && <p className="muted">Loading job alerts…</p>}

    {!loading && matched.length > 0 && <>
      <h3 style={{ marginBottom:10, color:"var(--navy)" }}>★ Matched to your location</h3>
      <div className="stack" style={{ marginBottom:22 }}>{matched.map(j => <JobCard key={j.id} job={j} highlight={true} />)}</div>
    </>}

    {!loading && other.length > 0 && <>
      <h3 style={{ marginBottom:10, color:"var(--muted)" }}>Other job alerts</h3>
      <div className="stack">{other.map(j => <JobCard key={j.id} job={j} highlight={false} />)}</div>
    </>}

    {!loading && jobs.length === 0 && <div className="empty panel">No job alerts available right now. Check back soon.</div>}
  </div></div>;
}

/* =====================================================================
   Admin — contractor verification tab (patched into existing Admin)
   ===================================================================== */
function AdminContractors() {
  const { toast } = useApp();
  const [contractors, setContractors] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busyId, setBusyId] = useState("");

  const load = async () => {
    setLoading(true);
    try {
      const res = await fetch("/api/contractor/list");
      const d = await res.json();
      setContractors(d.contractors || []);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const verify = async (id, v) => {
    setBusyId(id);
    try {
      const res = await fetch("/api/contractor/verify", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id, verified: v }) });
      const d = await res.json();
      if (d.success) { toast(d.contractor.name + (v ? " verified ✓" : " rejected ✗")); load(); }
    } catch { toast("Error updating."); }
    setBusyId("");
  };

  const reScore = async (id) => {
    setBusyId(id + "-score");
    try {
      const res = await fetch("/api/contractor/trust-score", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id }) });
      const d = await res.json();
      if (d.success) { toast("Trust score updated: " + d.contractor.trustScore + "/100"); load(); }
    } catch { toast("Gemini score error."); }
    setBusyId("");
  };

  if (loading) return <p className="muted">Loading contractors…</p>;
  if (!contractors.length) return <div className="empty">No contractors registered yet.</div>;

  return <div className="stack">
    {contractors.map(c => <div key={c.id} className="panel">
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginBottom:4 }}>
            <b>{c.company}</b>
            <span className="small muted">({c.name})</span>
            {c.verified ? <span className="verified-chip">✓ Verified</span> : <span className="unverified-chip">⏳ Pending</span>}
            <TrustBadge level={c.trustLevel} score={c.trustScore} />
          </div>
          <div className="small muted" style={{ marginBottom:4 }}>📍 {c.city}, {c.state} &nbsp;·&nbsp; 📞 {c.mobile} {c.email ? "·  " + c.email : ""} {c.gst ? "·  GST: " + c.gst : "·  ⚠ No GST"}</div>
          <div className="small muted" style={{ marginBottom:4 }}>{c.description || <i>No description</i>}</div>
          {c.trustReason && <div className="small" style={{ color:"var(--navy)", marginBottom:2 }}>Gemini: {c.trustReason}</div>}
          {c.trustFlags && c.trustFlags.length > 0 && <div className="small" style={{ color:"var(--red)" }}>Flags: {c.trustFlags.join(", ")}</div>}
          {c.trustScore != null && <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:6 }}>
            <div className="trust-bar-wrap"><div className={"trust-bar-fill trust-" + (c.trustLevel || "low").toLowerCase()} style={{ width: c.trustScore + "%" }} /></div>
            <span className="small muted">{c.trustScore}/100</span>
          </div>}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {!c.verified
            ? <button className="btn primary sm" disabled={busyId === c.id} onClick={() => verify(c.id, true)}>{busyId === c.id ? "Saving…" : "✓ Verify"}</button>
            : <button className="btn danger sm" disabled={busyId === c.id} onClick={() => verify(c.id, false)}>{busyId === c.id ? "Saving…" : "✗ Revoke"}</button>}
          <button className="btn ghost sm" disabled={busyId === c.id + "-score"} onClick={() => reScore(c.id)}>{busyId === c.id + "-score" ? "Running…" : "Re-run Gemini score"}</button>
        </div>
      </div>
    </div>)}
  </div>;
}

/* =====================================================================
   App root
   ===================================================================== */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem("ss_user") || "null"); } catch { return null; } });
  const [data, setData] = useState({ queue:[], checkins:[], complaints:[] });
  const [sim, setSimState] = useState(false); const [netOn, setNetOn] = useState(navigator.onLine);
  const [toasts, setToasts] = useState([]);
  const online = netOn && !sim;

  const reload = useCallback(async () => { const [queue, checkins, complaints] = await Promise.all([DB.all("queue"), DB.all("checkins"), DB.all("complaints")]); setData({ queue, checkins, complaints }); }, []);
  const toast = useCallback((m) => { const id = uid(); setToasts(t => [...t, { id, m }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200); }, []);
  const setSim = (v) => { net.forced = v; setSimState(v); toast(v ? "Network switched off (simulated)." : "Network is back."); };
  const logout = () => { localStorage.removeItem("ss_user"); setUser(null); go("home"); };

  useEffect(() => { seed().then(reload); const h = () => setRoute(parseHash()); addEventListener("hashchange", h);
    const on = () => setNetOn(true), off = () => setNetOn(false); addEventListener("online", on); addEventListener("offline", off);
    return () => { removeEventListener("hashchange", h); removeEventListener("online", on); removeEventListener("offline", off); }; }, []);
  useEffect(() => { if (online && data.queue.length) syncQueue().then(n => { if (n) { toast(`Back online: ${n} queued check-in${n > 1 ? "s" : ""} synced.`); } reload(); }); }, [online, data.queue.length]);

  let page;
  if (route === "home")         page = <Home />;
  else if (route === "login")   page = <Login />;
  else if (route === "contractor-login") page = <ContractorLogin />;
  else if (route === "contractor") page = user?.role === "contractor" ? <ContractorDashboard /> : <ContractorLogin />;
  else if (route === "jobs")    page = <JobAlertsPage />;
  else if (route === "worker")  page = user?.role === "citizen" ? <Worker /> : <Login next="worker" need="citizen" />;
  else if (route === "schemes") page = <GovernmentSchemesPage />;
  else if (route === "help")    page = <HelpCentrePage />;
  else if (route === "complaints") page = user?.role === "citizen" ? <Complaints /> : <Login next="complaints" need="citizen" />;
  else if (route === "admin")   page = user?.role === "admin" ? <Admin /> : <Login next="admin" need="admin" />;
  else page = <Home />;

  return <AppCtx.Provider value={{ user, setUser, logout, data, reload, online, sim, setSim, toast }}>
    <Nav route={route} />{page}<GovFooter /><Chat />
    <div className="toasts" aria-live="polite">{toasts.map(t => <div className="toast" key={t.id}>{t.m}</div>)}</div>
  </AppCtx.Provider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
