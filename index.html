<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shram Sanchar — consent-first mobility layer for eShram</title>
<meta name="theme-color" content="#0E2A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============ Design tokens ============
   Palette comes from the pitch deck: deck navy, saffron, field green.
   Type: Noto covers Devanagari + other Indic scripts, so Hindi/Marathi/etc. render properly. */
:root{
  --navy:#0E2A5C; --navy-2:#173F86; --navy-3:#DCE5F5;
  --saffron:#F07D1A; --saffron-2:#FBE5D0;
  --green:#1F8A4C; --green-2:#DDF0E4;
  --red:#C62828; --red-2:#FBE0E0;
  --amber:#A66B00; --amber-2:#FFF0C7;
  --ink:#14182B; --muted:#5B6478; --line:#DDE2EE; --bg:#F5F7FB; --card:#fff;
  --serif:'Noto Serif','Cambria','Georgia',serif;
  --sans:'Noto Sans','Segoe UI',system-ui,-apple-system,'Nirmala UI',sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;top:0!important}
.goog-te-banner-frame{display:none!important}
#google_translate_element{display:none!important}
h1,h2,h3,h4{font-family:var(--serif);margin:0;line-height:1.2;color:var(--navy)}
h1{font-size:clamp(2rem,4.6vw,3.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,2.8vw,2.1rem)}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--navy-2)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tri{height:5px;background:linear-gradient(90deg,var(--saffron) 0 33.3%,#fff 33.3% 66.6%,var(--green) 66.6%);border-bottom:1px solid var(--line)}

/* ============ Nav ============ */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-family:var(--serif);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px;stroke:#fff}
.nav-links{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links a{padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;white-space:nowrap}
.nav-links a:hover{background:var(--bg);color:var(--navy)}
.nav-links a.on{color:var(--navy);background:var(--navy-3)}
.nav-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.on{background:var(--green-2);color:var(--green)}
.pill.off{background:var(--saffron-2);color:#A24E00}
.pill svg{width:13px;height:13px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ============ Buttons & fields ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 18px;font-weight:600;font-size:.95rem;text-decoration:none;transition:background .15s,border-color .15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.accent{background:var(--saffron);color:#fff}
.btn.accent:hover{background:#D96C0C}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:var(--navy);background:#fff}
.btn.danger{background:var(--red-2);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9rem;color:var(--ink)}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px var(--navy-3)}
textarea{resize:vertical;min-height:96px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}

/* ============ Surfaces ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
.panel h3{margin-bottom:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.b-Critical{background:var(--red);color:#fff}
.b-High{background:var(--saffron-2);color:#A24E00}
.b-Medium{background:var(--amber-2);color:var(--amber)}
.b-Low{background:var(--green-2);color:var(--green)}
.b-queued{background:var(--saffron-2);color:#A24E00}
.b-synced{background:var(--green-2);color:var(--green)}
.b-Open{background:var(--navy-3);color:var(--navy)}
.b-review{background:var(--amber-2);color:var(--amber)}
.b-Resolved{background:var(--green-2);color:var(--green)}

/* ============ Hero ============ */
.hero{padding:56px 0 64px;background:
  radial-gradient(900px 400px at 85% -10%,rgba(240,125,26,.12),transparent 60%),
  radial-gradient(700px 400px at -10% 110%,rgba(31,138,76,.10),transparent 60%),#fff;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero p.lead{font-size:1.12rem;color:var(--muted);margin:18px 0 26px;max-width:52ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .track{margin-top:26px;font-size:.88rem;color:var(--muted)}
.hero .facts{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.hero .facts div{border-left:3px solid var(--saffron);padding-left:12px}
.hero .facts b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--navy)}
.hero .facts span{font-size:.82rem;color:var(--muted)}
.demo{background:var(--navy);border-radius:var(--r-lg);padding:22px;color:#fff;box-shadow:0 24px 50px -24px rgba(14,42,92,.6)}
.demo .bar{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;opacity:.85;margin-bottom:16px}
.demo .consent{background:rgba(255,255,255,.1);border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;margin-bottom:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.3);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.demo .mic{width:64px;height:64px;border-radius:50%;background:var(--saffron);display:grid;place-items:center;margin:0 auto 14px}
.demo .mic svg{width:28px;height:28px;stroke:#fff}
.demo .mic.live{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,125,26,.6)}100%{box-shadow:0 0 0 22px rgba(240,125,26,0)}}
.demo .said{min-height:52px;text-align:center;font-size:1.05rem;margin-bottom:16px}
.demo .rec{background:#fff;color:var(--ink);border-radius:var(--r-md);padding:14px 16px;transition:opacity .4s}
.demo .rec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px;font-size:.92rem}
.demo .rec dt{color:var(--muted)}
.demo .rec dd{margin:0;font-weight:600}
.demo .rec .st{font-size:.82rem;font-weight:600;color:#A24E00;background:var(--saffron-2);padding:5px 10px;border-radius:var(--r-sm)}

/* ============ Sections ============ */
section.block{padding:64px 0}
section.block.alt{background:#fff;border-block:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:30px}
.sec-head p{color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.problem{border-radius:var(--r-md);padding:20px;border:1px solid var(--line)}
.problem h3{margin-bottom:6px}
.problem p{color:var(--muted);font-size:.95rem}
.p1{background:#FBE9DB}.p2{background:#E1E8F6}.p3{background:#EDEEF1}.p4{background:#E3F1E7}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.step{padding:18px 18px 18px 0;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;margin-bottom:12px;position:relative;z-index:1}
.step::after{content:"";position:absolute;top:34px;left:34px;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--saffron) 0 8px,transparent 8px 14px)}
.step:last-child::after{display:none}
.step h4{font-family:var(--sans);font-size:1rem;color:var(--ink);margin-bottom:4px}
.step p{font-size:.9rem;color:var(--muted)}
.privacy{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.privacy ul{margin:16px 0 0;padding-left:20px;color:var(--muted)}
.privacy li{margin-bottom:8px}
.privacy li b{color:var(--ink)}
.callout{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:28px}
.callout h3{color:#fff;margin-bottom:8px}
.callout p{opacity:.9}

/* ============ Page shells ============ */
.page{padding:32px 0 56px;min-height:70vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.cols.wide{grid-template-columns:1fr 380px}
.stack{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px;margin-bottom:18px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:6px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}

/* consent */
.consent-box{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;background:var(--bg)}
.consent-box.on{border-color:var(--green);background:var(--green-2)}
.consent-box .txt{flex:1;font-size:.9rem}
.consent-box .txt b{display:block;font-size:1rem;margin-bottom:2px}
.toggle{width:52px;height:30px;border-radius:99px;border:0;background:#B8BFCE;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(22px)}

/* voice */
.voice{text-align:center;padding:8px 0 4px}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--saffron);display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 10px 24px -10px rgba(240,125,26,.9)}
.micbtn svg{width:40px;height:40px;stroke:#fff}
.micbtn.live{animation:pulse 1.3s infinite;background:var(--red)}
.transcript{min-height:56px;padding:10px 14px;background:var(--bg);border-radius:var(--r-sm);font-size:1.02rem;text-align:left;border:1.5px dashed var(--line)}
.parsed{border:1.5px solid var(--navy-3);border-radius:var(--r-md);padding:14px;background:#fff}
.parsed .src{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.map{width:100%;border-radius:var(--r-md);border:1px solid var(--line);z-index:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border:0}
.timeline .when{width:96px;flex:none;font-size:.8rem;color:var(--muted)}
.timeline .what{flex:1;min-width:0}
.timeline .what b{display:block}

/* tables & stats */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;border-left:4px solid var(--navy)}
.kpi:nth-child(2){border-left-color:var(--green)}
.kpi:nth-child(3){border-left-color:var(--saffron)}
.kpi:nth-child(4){border-left-color:var(--red)}
.kpi b{font-family:var(--serif);font-size:1.9rem;color:var(--navy);display:block;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600;color:var(--muted);font-size:.82rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
.bars .b{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;font-size:.86rem;margin:7px 0}
.bars .track{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:var(--navy-2);border-radius:99px}
.bars.g .fill{background:var(--green)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* login */
.login{max-width:460px;margin:0 auto}
.hint{background:var(--amber-2);color:#6B4700;border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;margin-bottom:14px}
.err{color:var(--red);font-size:.85rem;margin:-6px 0 10px}

/* contractor */
.trust-bar-wrap{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;flex:1}
.trust-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.trust-high{background:var(--green)}.trust-medium{background:var(--saffron)}.trust-low{background:var(--red)}
.trust-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
.trust-badge.High{background:var(--green-2);color:var(--green)}.trust-badge.Medium{background:var(--amber-2);color:var(--amber)}.trust-badge.Low{background:var(--red-2);color:var(--red)}.trust-badge.Unverified{background:var(--bg);color:var(--muted)}
.job-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;position:relative}
.job-card .jc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.job-card h4{margin:0 0 2px;font-family:var(--sans);color:var(--ink);font-size:1rem}
.job-card .jc-meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
.job-card .jc-desc{font-size:.9rem;color:var(--muted)}
.job-card .jc-wage{font-weight:700;color:var(--green);font-size:.95rem}
.relevance-pill{background:var(--navy-3);color:var(--navy);border-radius:99px;font-size:.72rem;font-weight:700;padding:2px 8px;white-space:nowrap}
.contractor-reg{max-width:560px;margin:0 auto}
.verified-chip{display:inline-flex;align-items:center;gap:4px;background:var(--green-2);color:var(--green);border-radius:99px;font-size:.78rem;font-weight:700;padding:2px 8px}
.unverified-chip{display:inline-flex;align-items:center;gap:4px;background:var(--saffron-2);color:#A24E00;border-radius:99px;font-size:.78rem;font-weight:700;padding:2px 8px}

/* chat */
.chat-fab{position:fixed;right:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px -8px rgba(14,42,92,.7)}
.chat-fab svg{width:26px;height:26px}
.chat{position:fixed;right:20px;bottom:90px;z-index:60;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 120px));background:#fff;border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(14,42,92,.5);overflow:hidden}
.chat header{background:var(--navy);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chat header b{font-family:var(--serif)}
.chat header button{background:none;border:0;color:#fff;display:grid}
.chat header svg{width:20px;height:20px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:.92rem;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:var(--bg)}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:.78rem;color:var(--navy)}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat form input{flex:1}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:var(--r-md);padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto}
.modal h3{margin-bottom:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
video.cam{width:100%;border-radius:var(--r-sm);background:#000;max-height:60vh}
.toasts{position:fixed;left:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 100px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:.9rem;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}

/* footer */
footer.gov{background:var(--navy);color:#DCE5F5;padding:48px 0 28px;margin-top:0}
footer.gov h3{color:#fff;margin-bottom:14px}
.helplines{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:34px}
.hl{background:rgba(255,255,255,.08);border-radius:var(--r-sm);padding:12px 14px;border-left:3px solid var(--saffron)}
.hl b{display:block;font-family:var(--serif);font-size:1.35rem;color:#fff}
.hl a{color:#fff;text-decoration:none}
.hl span{font-size:.82rem;opacity:.85}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 24px;margin-bottom:28px}
.links a{color:#DCE5F5;text-decoration:none;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:.92rem;display:flex;justify-content:space-between;gap:8px}
.links a:hover{color:#fff;border-color:var(--saffron)}
.links a span{opacity:.6;font-size:.8rem}
.disclaimer{font-size:.8rem;opacity:.75;max-width:80ch}

/* ============ Responsive ============ */
@media (max-width:980px){
  .hero .wrap,.privacy,.cols,.cols.even,.cols.wide{grid-template-columns:1fr}
  .grid4,.kpis{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .step{padding:0 0 18px 50px}
  .step::before{position:absolute;left:0;top:0}
  .step::after{top:34px;left:16px;right:auto;bottom:0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--saffron) 0 8px,transparent 8px 14px)}
}
@media (max-width:620px){
  .grid2,.grid3,.grid4,.kpis{grid-template-columns:1fr}
  .nav .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}

  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
let _db; const getDB = () => _db || (_db = openDB());
const tx = async (store, mode, fn) => {
  const d = await getDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
  });
};

/* Sync engine — in production this is the Node/Express endpoint that dedupes and
   forwards to eShram's data-sharing API. Here it moves items from queue to "server". */
async function syncQueue() {
  if (!isOnline()) return 0;
  const q = await DB.all("queue"); let n = 0;
  for (const item of q) {
    const exists = await DB.get("checkins", item.id);           // dedupe by id
    if (!exists) { await DB.put("checkins", { ...item, status:"synced", syncedAt:Date.now() }); n++; }
    await DB.del("queue", item.id);
  }
  return n;
}

/* =====================================================================
   Gemini & Backend APIs
   ===================================================================== */
async function gemini({ system, contents, json = false }) {
  // First try secure server-side API endpoint
  try {
    const promptText = contents?.[contents.length - 1]?.parts?.[0]?.text || "";
    const res = await fetch('/api/ai/assistant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: system ? `System: ${system}\n\nUser text: ${promptText}` : promptText, history: contents.slice(0, -1) })
    });
    if (res.ok) {
      const data = await res.json();
      if (data.reply) return data.reply;
    }
  } catch (e) {}

  // Fallback to client key if set in browser
  const s = getSettings(); const key = s.geminiKey || GEMINI_API_KEY;
  if (!key) throw new Error("NO_KEY");
  if (!isOnline()) throw new Error("OFFLINE");
  const modelToUse = s.model && s.model !== "gemini-2.5-flash" ? s.model : GEMINI_MODEL_DEFAULT;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent`;
  const body = { contents, generationConfig: { temperature: json ? 0.1 : 0.6, ...(json ? { responseMimeType:"application/json" } : {}) } };
  if (system) body.systemInstruction = { parts:[{ text: system }] };
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": key }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("Gemini " + r.status);
  const d = await r.json();
  return (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
}

// Extract place name (city, state, district) using AI/Gemini or Regex/OSM
async function extractLocationFromText(text) {
  if (!text) return null;
  
  // 1. First try Gemini AI if key configured / available
  try {
    const sysPrompt = `Extract ONLY the Indian city, district, town, or state name mentioned in the following user complaint. Return a JSON object with key "place" (string in English or Hindi, or "" if none found). Text: "${text}"`;
    const resText = await gemini({ system: sysPrompt, json: true, contents: [{ role: "user", parts: [{ text }] }] });
    const parsed = parseJSON(resText);
    if (parsed && parsed.place) {
      const geo = await resolveDestination(parsed.place);
      if (geo) return geo;
      return { name: parsed.place, state: "" };
    }
  } catch (e) {}

  // 2. Check local cities database
  const c = findCity(text);
  if (c) return c;

  // 3. Match common states & major districts/cities via regex
  const locRegex = /बिहार|गुजरात|महाराष्ट्र|उत्तर प्रदेश|राजस्थान|मध्य प्रदेश|पंजाब|हरियाणा|पश्चिम बंगाल|झारखंड|ओडिशा|तमिलनाडु|कर्नाटक|केरल|आंध्र प्रदेश|तेलंगाना|असम|छत्तीसगढ़|उत्तराखंड|हिमाचल|bihar|gujarat|maharashtra|up|uttar pradesh|rajasthan|mp|madhya pradesh|punjab|haryana|bengal|jharkhand|odisha|tamil nadu|karnataka|kerala|ap|andhra|telangana|assam|chhattisgarh|delhi|mumbai|surat|pune|patna|gaya|muzaffarpur|darbhanga|bhagalpur|ranchi|dhanbad|kanpur|lucknow|varanasi|agra/i;
  const match = text.match(locRegex);
  if (match) {
    const geo = await resolveDestination(match[0]);
    if (geo) return geo;
    return { name: match[0].charAt(0).toUpperCase() + match[0].slice(1), state: "" };
  }

  // 4. Try resolving cleaned full text via Nominatim
  return await resolveDestination(text);
}

async function resolveDestination(name) {
  if (!name) return null;
  const c = findCity(name); if (c) return c;
  if (!isOnline()) return null;
  try {
    const cleanQuery = name.replace(/मुझे|यहाँ|वेजेस|नहीं|मिली|काम|किया|था|लेकिन|पैसा|शिकायत|में|से|पर|और|को|का|की|के|आई|हूँ|जा|रहा|है|था|गया|मजदूरी/gi, " ").trim();
    const q = cleanQuery || name;

    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=in&q=" + encodeURIComponent(q), { signal: ctl.signal });

}

const EXTRACT_SYS = `You convert a migrant worker's spoken status (any Indian language or English) into JSON with keys:
destination (city name in English, "" if none), state (2-letter Indian state code, "" if unknown), job_type (English, e.g. Construction, Factory work, Agriculture, Domestic work, Delivery / Driving, Hospitality, Textile, Mining / Quarry, Security, Other),
intent (one of: traveling, arrived, returning_home, seeking_work, other), summary (one short English sentence). Return JSON only.`;

const PRIORITY_SYS = `You triage grievances filed by migrant workers for a labour department. Return JSON only with keys:
priority ("Critical" | "High" | "Medium" | "Low"), reason (one short English sentence), department (who should handle it), action (one concrete next step for the officer).
Critical = threat to life or safety, violence, bonded labour, trafficking, confinement, serious injury or death. High = unpaid wages, unsafe conditions, harassment, eviction, no food or shelter. Medium = eShram/UAN card issues, benefits access, document problems. Low = general questions or feedback.`;

function localPriority(text, category) {
  const t = (text + " " + category).toLowerCase();
  const crit = /beat|violen|threat|trapped|locked|bonded|captive|rape|abus|died|death|fatal|accident|injur|child labo|traffick|confiscat|हिंसा|मारपीट|धमकी|बंधक|दुर्घटना|मौत/;
  const high = /not paid|unpaid|no wage|wage|salary|harass|unsafe|no food|evict|thrown out|fired|मजदूरी|वेतन|पैसे नहीं|भूखे|निकाल|accommodation|shelter/;
  const med = /card|uan|e-?shram|document|benefit|scheme|registration|update|कार्ड/;
  if (crit.test(t)) return { priority:"Critical", reason:"Mentions a possible threat to safety or life.", department:"Police (112) + District Labour Officer", action:"Call the worker immediately and coordinate with local police.", source:"On-device rules" };
  if (high.test(t)) return { priority:"High", reason:"Wage, safety or shelter issue affecting the worker's livelihood.", department:"Labour Enforcement Officer", action:"Contact employer and record a statement within 48 hours.", source:"On-device rules" };
  if (med.test(t)) return { priority:"Medium", reason:"Registration or benefits issue.", department:"eShram helpdesk", action:"Verify UAN details and guide the worker through the fix.", source:"On-device rules" };
  return { priority:"Low", reason:"General query or feedback.", department:"Help desk", action:"Reply with information.", source:"On-device rules" };
}
async function checkPriority(text, category) {
  try {
    const t = await gemini({ system: PRIORITY_SYS, json:true, contents:[{ role:"user", parts:[{ text:`Category: ${category}\nComplaint: ${text}` }] }] });
    const j = parseJSON(t);
    if (!["Critical","High","Medium","Low"].includes(j.priority)) throw new Error("bad");
    return { priority:j.priority, reason:j.reason || "", department:j.department || "", action:j.action || "", source:"Gemini" };
  } catch { return localPriority(text, category); }
}

function ReadAloud({ text, lang = "hi-IN" }) {
  const [speaking, setSpeaking] = useState(false);

  const toggle = () => {
    if (speaking) {
      stopSpeak();
      setSpeaking(false);
    } else {
      speak(text, lang);
      setSpeaking(true);
    }
  };

  return <button type="button" className={"btn " + (speaking ? "danger" : "ghost") + " sm"} style={{ padding: "3px 8px", fontSize: ".8rem", display: "inline-flex", alignItems: "center", gap: "4px" }} onClick={toggle}>
    {speaking ? "✖ Stop" : "🔊 Listen"}
  </button>;
}
function Modal({ title, onClose, children }) {
  return <div className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
    <div className="modal" role="dialog" aria-modal="true" aria-label={title}><h3>{title}</h3>{children}</div>
  </div>;
}

function MapView({ markers, lines = [], height = 380 }) {
  const el = useRef(); const map = useRef(); const layer = useRef();
  useEffect(() => {
    map.current = L.map(el.current, { scrollWheelZoom:false }).setView([22.5, 79], 4.6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18, attribution:"© OpenStreetMap contributors" }).addTo(map.current);
    layer.current = L.layerGroup().addTo(map.current);
    setTimeout(() => map.current && map.current.invalidateSize(), 150);
    return () => { map.current.remove(); map.current = null; };
  }, []);
  const sig = JSON.stringify([markers.map(m => [m.lat, m.lng, m.color, m.popup]), lines]);
  useEffect(() => {
    const g = layer.current; if (!g) return; g.clearLayers();
    lines.forEach(l => L.polyline(l.points, { color:l.color || "#0E2A5C", weight:3, dashArray:"6 8", opacity:.7 }).addTo(g));
    markers.forEach(m => L.circleMarker([m.lat, m.lng], { radius:m.r || 9, color:"#fff", weight:2, fillColor:m.color, fillOpacity:1 }).bindPopup(m.popup).addTo(g));
    if (markers.length) map.current.fitBounds(L.latLngBounds(markers.map(m => [m.lat, m.lng])), { padding:[40, 40], maxZoom:9 });
  }, [sig]);
  return <div ref={el} className="map" style={{ height }} />;
}

function PhotoField({ photo, setPhoto, label = "Add photo" }) {
  const [cam, setCam] = useState(false);
  const fileRef = useRef();
  const fromFile = (e) => {
    const f = e.target.files[0]; if (!f) return; const img = new Image();
    img.onload = () => setPhoto(shrink(img, img.width, img.height)); img.src = URL.createObjectURL(f);
  };
  return <div className="photo-row">
    {photo && <img className="thumb" src={photo} alt="Attached" />}
    <button type="button" className="btn ghost sm" onClick={() => setCam(true)}><Icon n="camera" />{photo ? "Retake" : label}</button>
    <button type="button" className="btn ghost sm" onClick={() => fileRef.current.click()}>Upload</button>
    {photo && <button type="button" className="btn ghost sm" onClick={() => setPhoto(null)}>Remove</button>}
    <input ref={fileRef} type="file" accept="image/*" hidden onChange={fromFile} />
    {cam && <CameraModal onClose={() => setCam(false)} onCapture={setPhoto} />}
  </div>;
}
function shrink(src, w0, h0) {
  const w = 480, h = Math.round(w * (h0 || 3) / (w0 || 4));
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(src, 0, 0, w, h);
  return c.toDataURL("image/jpeg", .7);
}
function CameraModal({ onCapture, onClose }) {
  const v = useRef(); const stream = useRef(); const [err, setErr] = useState("");
  useEffect(() => {
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error("not supported in this browser or context");
        stream.current = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
        v.current.srcObject = stream.current; v.current.play();
      } catch (e) { setErr("Camera unavailable: " + e.message + ". Use Upload instead."); }
    })();
    return () => stream.current && stream.current.getTracks().forEach(t => t.stop());
  }, []);
  const snap = () => { onCapture(shrink(v.current, v.current.videoWidth, v.current.videoHeight)); onClose(); };
  return <Modal title="Take a photo" onClose={onClose}>
    {err ? <p className="err">{err}</p> : <video ref={v} className="cam" playsInline muted />}
    <div className="acts"><button className="btn ghost" onClick={onClose}>Cancel</button><button className="btn accent" disabled={!!err} onClick={snap}>Capture</button></div>
  </Modal>;
}

function Bars({ items, green }) {
  const max = Math.max(1, ...items.map(i => i[1]));
  return <div className={"bars" + (green ? " g" : "")}>{items.map(([k, v]) =>
    <div className="b" key={k}><span>{k}</span><div className="track"><div className="fill" style={{ width:(v / max * 100) + "%" }} /></div><b>{v}</b></div>)}
    {!items.length && <p className="empty">No data yet.</p>}</div>;
}

function HeroDemo() {
  const line = "मैं सूरत जा रहा हूँ, निर्माण काम के लिए";
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [n, setN] = useState(reduce ? line.length : 0); const [ph, setPh] = useState(reduce ? 3 : 0);
  useEffect(() => {
    if (reduce) return; let t;
    if (ph === 0) t = setTimeout(() => n < line.length ? setN(n + 1) : setPh(1), n === 0 ? 1000 : 55);
    else if (ph === 1 || ph === 2) t = setTimeout(() => setPh(ph + 1), 750);
    else t = setTimeout(() => { setN(0); setPh(0); }, 5000);
    return () => clearTimeout(t);
  }, [n, ph]);
  const show = (k) => ({ opacity: ph >= k ? 1 : .18 });
  return <div className="demo" aria-label="Animated example of a voice check-in">
    <div className="bar"><span>eShram · Shram Sanchar</span><span>Offline — cached on device</span></div>
    <div className="consent"><span><b>Location check-in: OFF</b><br />Turn on only for this trip?</span><span className="switch" /></div>
    <div className={"mic" + (ph === 0 ? " live" : "")}><Icon n="mic" /></div>
    <div className="said" lang="hi">“{line.slice(0, n)}”</div>
    <div className="rec"><dl>
      <dt>Destination</dt><dd style={show(1)}>Surat, GJ</dd>
      <dt>Work type</dt><dd style={show(2)}>Construction</dd>
      <dt>Intent</dt><dd style={show(2)}>Traveling</dd></dl>
      <div className="st" style={show(3)}>Queued — will sync when a network appears</div></div>
  </div>;
}

function Login({ next, need }) {
  const { setUser, toast } = useApp();
  const [tab, setTab] = useState(need === "admin" ? "admin" : "citizen");
  const [step, setStep] = useState(1); const [f, setF] = useState({ name:"", uan:"", mobile:"", otp:"", id:"", pw:"" }); const [err, setErr] = useState("");
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const done = (u, dest) => { localStorage.setItem("ss_user", JSON.stringify(u)); setUser(u); go(dest); };
  const sendOtp = (e) => {
    e.preventDefault(); setErr("");
    if (f.name.trim().length < 2) return setErr("Enter your full name.");
    if (!/^\d{12}$/.test(f.uan)) return setErr("UAN must be exactly 12 digits.");
    if (!/^[6-9]\d{9}$/.test(f.mobile)) return setErr("Enter a valid 10-digit mobile number.");
    setStep(2); toast("Demo OTP: 123456");
  };
  const verify = (e) => {
    e.preventDefault();
    if (f.otp !== "123456") return setErr("Wrong OTP. In this demo it is 123456.");
    done({ role:"citizen", name:f.name.trim(), uan:f.uan, mobile:f.mobile }, next || "worker");
  };
  const adminLogin = (e) => {
    e.preventDefault();
    if (f.id === "admin" && f.pw === "admin123") done({ role:"admin", name:"Labour Officer" }, next || "admin");
    else setErr("Wrong ID or password. Demo: admin / admin123");
  };
  return <div className="page"><div className="wrap"><div className="login panel">
    <h2 style={{ marginBottom:14 }}>Log in</h2>
    <div className="tabs">{[["citizen","Citizen"],["admin","Officer"]].map(([k, l]) => <button key={k} className={tab === k ? "on" : ""} onClick={() => { setTab(k); setErr(""); setStep(1); }}>{l}</button>)}</div>
    {tab === "citizen" && step === 1 && <form onSubmit={sendOtp}>
      <div className="hint">Demo: use any name, any 12-digit number as UAN, and any mobile starting with 6–9. The OTP is 123456. Aadhaar eKYC would replace this step in production.</div>
      <div className="field"><label htmlFor="n">Full name</label><input id="n" value={f.name} onChange={set("name")} autoComplete="name" /></div>
      <div className="field"><label htmlFor="u">UAN (12 digits)</label><input id="u" inputMode="numeric" maxLength={12} value={f.uan} onChange={set("uan")} /></div>
      <div className="field"><label htmlFor="m">Mobile number</label><input id="m" inputMode="numeric" maxLength={10} value={f.mobile} onChange={set("mobile")} autoComplete="tel" /></div>
      {err && <p className="err">{err}</p>}<button className="btn primary" style={{ width:"100%" }}>Send OTP</button>
      <div style={{ marginTop: "14px", textAlign: "center" }}>
        <button type="button" className="btn accent sm" style={{ width: "100%" }} onClick={() => speak("To log in, enter your full name, 12 digit U A N number, and mobile number. Then click Send O T P.", "en-IN")}>
          🎙️ "Need Help?" (Listen Login Instructions)
        </button>
      </div>
    </form>}
    {tab === "citizen" && step === 2 && <form onSubmit={verify}>
      <p className="muted small" style={{ marginBottom:12 }}>Enter the 6-digit OTP sent to {f.mobile}.</p>
      <div className="field"><label htmlFor="o">OTP</label><input id="o" inputMode="numeric" maxLength={6} value={f.otp} onChange={set("otp")} autoFocus /></div>
      {err && <p className="err">{err}</p>}
      <div className="row"><button type="button" className="btn ghost" onClick={() => { setStep(1); setErr(""); }}>Back</button><button className="btn primary">Verify and log in</button></div>
    </form>}
    {tab === "admin" && <form onSubmit={adminLogin}>
      <div className="hint">Admin access: Log in with credentials or click Quick Demo Access.</div>
      <div className="field"><label htmlFor="a">Officer ID</label><input id="a" value={f.id} onChange={set("id")} autoComplete="username" /></div>
      <div className="field"><label htmlFor="p">Password</label><input id="p" type="password" value={f.pw} onChange={set("pw")} autoComplete="current-password" /></div>
      {err && <p className="err">{err}</p>}
      <div className="row">
        <button className="btn primary">Log in</button>
        <button type="button" className="btn accent" onClick={() => done({ role:"admin", name:"Labour Officer" }, next || "admin")}>Quick Demo Access</button>
      </div>
    </form>}
  </div></div></div>;
}

function Worker() {
  const { user, data, reload, online, sim, setSim, toast } = useApp();
  const [lang, setLang] = useState(() => localStorage.getItem("ss_lang") || "hi-IN");
  const [consent, setConsent] = useState(() => JSON.parse(localStorage.getItem("ss_consent") || '{"on":false}'));
  const [text, setText] = useState(""); const [listening, setListening] = useState(false); const [busy, setBusy] = useState(false);
  const [parsed, setParsed] = useState(null); const [photo, setPhoto] = useState(null); const [confirmDel, setConfirmDel] = useState(false);
  const rec = useRef();

  const toggleConsent = () => { const c = { on: !consent.on, at: Date.now() }; setConsent(c); localStorage.setItem("ss_consent", JSON.stringify(c)); toast(c.on ? "Location check-in is ON for this trip." : "Location check-in is OFF."); };
  const changeLang = (v) => { setLang(v); localStorage.setItem("ss_lang", v); };

  const analyze = async (t) => {
    if (!t.trim()) return toast("Speak or type your update first."); setBusy(true);
    let out;
    try { out = parseJSON(await gemini({ system: EXTRACT_SYS, json:true, contents:[{ role:"user", parts:[{ text:t }] }] })); out.source = "Gemini"; }
    catch { out = localExtract(t); out.source = "On-device parser"; }
    const geo = await resolveDestination(out.destination) || findCity(t);
    setParsed({ destination: geo?.name || out.destination || "", state: geo?.state || out.state || "", lat: geo?.lat, lng: geo?.lng,
      jobType: out.job_type || "", intent: INTENT[out.intent] ? out.intent : "traveling", summary: out.summary || "", source: out.source });
    setBusy(false);
  };
  const startListen = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast("Voice input needs Chrome or Edge. Type your update instead.");
    if (listening) { rec.current && rec.current.stop(); return; }
    const r = new SR(); r.lang = lang; r.interimResults = true; r.continuous = false; let last = "";
    r.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; last = t; setText(t); };
    r.onerror = (e) => { setListening(false); toast(e.error === "not-allowed" ? "Microphone blocked. Allow it in the browser address bar." : "Voice error: " + e.error); };
    r.onend = () => { setListening(false); if (last.trim()) analyze(last); };
    rec.current = r; setText(""); setParsed(null); r.start(); setListening(true);
  };
  const confirm = async () => {
    if (!parsed) return; setBusy(true);
    let gps = null;
    if (consent.on && navigator.geolocation) gps = await new Promise(res => navigator.geolocation.getCurrentPosition(
      p => res({ lat:+p.coords.latitude.toFixed(2), lng:+p.coords.longitude.toFixed(2) }), () => { toast("Could not read location — saved without it."); res(null); }, { timeout:8000, maximumAge:60000 }));
    const r = { id:uid(), uan:user.uan, name:user.name, destination:parsed.destination, state:parsed.state,
      lat: parsed.lat != null ? +parsed.lat.toFixed(2) : gps?.lat, lng: parsed.lng != null ? +parsed.lng.toFixed(2) : gps?.lng, gps,
      jobType:parsed.jobType, intent:parsed.intent, transcript:text, lang, photo, consent:consent.on, createdAt:Date.now(), status:"queued" };
    await DB.put("queue", r);
    if (isOnline()) { await syncQueue(); toast("Check-in synced to eShram (mock API)."); } else toast("Saved on this phone. It will sync when the network returns.");
    await reload(); speak(lang === "hi-IN" ? "चेक-इन सेव हो गया" : "Check-in saved", lang);
    setParsed(null); setText(""); setPhoto(null); setBusy(false);
  };
  const eraseMine = async () => {
    for (const r of [...data.queue, ...data.checkins].filter(x => x.uan === user.uan)) { await DB.del("queue", r.id); await DB.del("checkins", r.id); }
    await reload(); setConfirmDel(false); toast("Your check-ins were deleted.");
  };

  const mine = [...data.queue, ...data.checkins].filter(x => x.uan === user.uan).sort((a, b) => b.createdAt - a.createdAt);
  const markers = mine.filter(m => m.lat != null).map(m => ({ lat:m.lat, lng:m.lng, color: m.status === "queued" ? "#F07D1A" : "#1F8A4C",
    popup:`<b>${esc(m.destination || "Check-in")}</b><br>${esc(m.jobType)} · ${esc(INTENT[m.intent])}<br>${fmtTime(m.createdAt)}` }));
  const lines = useMemo(() => [{ points: [...mine].reverse().filter(m => m.lat != null).map(m => [m.lat, m.lng]) }], [mine.length]);

  return <div className="page"><div className="wrap">
    <div className="page-head"><div><h2>Namaste, {user.name.split(" ")[0]}</h2><p>UAN {user.uan.slice(0, 4)}••••{user.uan.slice(-4)} · Check in only when you move.</p></div>
      <label className="row" style={{ alignItems:"center", flex:"none", gap:8 }}><span className="small muted">Simulate no network</span>
        <button className={"toggle" + (sim ? " on" : "")} onClick={() => setSim(!sim)} aria-pressed={sim} aria-label="Simulate no network" /></label></div>
    <div className="cols">
      <div className="stack">
        <div className={"consent-box" + (consent.on ? " on" : "")}>
          <div className="txt"><b>Location check-in: {consent.on ? "ON for this trip" : "OFF"}</b>
            {consent.on ? "Your phone location is read once, roughly (about 1 km), each time you confirm a check-in."
                        : "When OFF, we never read your location. You can still check in by telling us where you are going."}
            <div lang="hi" className="muted" style={{ marginTop:4 }}>आपकी लोकेशन सिर्फ़ तब पढ़ी जाएगी जब आप चेक-इन पक्का करेंगे।</div></div>
          <button className={"toggle" + (consent.on ? " on" : "")} onClick={toggleConsent} aria-pressed={consent.on} aria-label="Location check-in" />
        </div>

        <div className="panel">
          <h3>Voice check-in</h3>
          <div className="field" style={{ marginTop:10 }}><label htmlFor="lg">Language</label><select id="lg" value={lang} onChange={e => changeLang(e.target.value)}>{LANGS.map(([c, n]) => <option key={c} value={c}>{n}</option>)}</select></div>
          <div className="voice">
            <button className={"micbtn" + (listening ? " live" : "")} onClick={startListen} aria-label={listening ? "Stop listening" : "Start speaking"}><Icon n="mic" /></button>
            <p className="small muted" style={{ marginBottom:10 }}>{listening ? "Listening… tap to stop" : "Tap and say, for example: “I am traveling to Surat for construction work”"}</p>
          </div>
          <div className="field"><label htmlFor="tx">What you said (you can also type)</label>
            <textarea id="tx" lang={lang.slice(0, 2)} value={text} onChange={e => setText(e.target.value)} placeholder="मैं सूरत जा रहा हूँ, निर्माण काम के लिए" /></div>
          <button className="btn primary" disabled={busy || !text.trim()} onClick={() => analyze(text)}>{busy && !parsed ? "Understanding…" : "Understand my update"}</button>
        </div>

        {parsed && <div className="panel parsed">
          <h3>Check this before you confirm</h3><p className="src">Read by: {parsed.source}. Fix anything that is wrong.</p>
          <div className="row"><div className="field"><label htmlFor="d">Destination</label><input id="d" value={parsed.destination} onChange={e => setParsed({ ...parsed, destination:e.target.value, lat:undefined, lng:undefined })} onBlur={async e => { const g = await resolveDestination(e.target.value); if (g) setParsed(p => ({ ...p, destination:g.name, state:g.state, lat:g.lat, lng:g.lng })); }} /></div>
            <div className="field"><label htmlFor="j">Work type</label><input id="j" value={parsed.jobType} onChange={e => setParsed({ ...parsed, jobType:e.target.value })} /></div></div>
          <div className="field"><label htmlFor="i">Status</label><select id="i" value={parsed.intent} onChange={e => setParsed({ ...parsed, intent:e.target.value })}>{Object.entries(INTENT).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
          <div className="field"><label>Site photo (optional)</label><PhotoField photo={photo} setPhoto={setPhoto} label="Take photo" /></div>
          
          <div style={{ background: "var(--bg)", padding: "10px 12px", borderRadius: "var(--r-sm)", margin: "10px 0", fontSize: ".85rem", border: "1px solid var(--line)" }}>
            <b>Data Confidence Breakdown:</b>
            <div style={{ display: "flex", gap: "10px", marginTop: "4px", flexWrap: "wrap" }}>
              <span>✓ Worker Confirmed (+30)</span>
              <span>{consent.on ? "✓ Location Shared (+25)" : "○ No Location (+0)"}</span>
              <span>✓ AI Extracted (+20)</span>
              <span>✓ Valid Time (+10)</span>
            </div>
            <div style={{ marginTop: "4px", fontWeight: "700", color: "var(--navy)" }}>
              Data Confidence Score: {consent.on ? "85%" : "60%"}
            </div>
          </div>

          <div className="row"><button className="btn ghost" onClick={() => setParsed(null)}>Discard</button><button className="btn accent" disabled={busy} onClick={confirm}>{busy ? "Saving…" : "Confirm check-in"}</button></div>
          <p className="small muted" style={{ marginTop:10 }}>{online ? "You are online: this will sync right away." : "You are offline: this will be saved on your phone and synced later."}</p>
        </div>}
      </div>

      <div className="stack">
        <div className="panel"><h3>Your journey</h3><p className="small muted" style={{ marginBottom:12 }}>Only check-ins you confirmed appear here. There is no background trail.</p>
          <MapView markers={markers} lines={lines} />
          <div className="legend"><span><i style={{ background:"#1F8A4C" }} />Synced to eShram</span><span><i style={{ background:"#F07D1A" }} />Waiting on this phone</span></div></div>
        <div className="panel"><div className="page-head" style={{ marginBottom:0 }}><h3>Check-in history</h3>
          {mine.length > 0 && <button className="btn danger sm" onClick={() => setConfirmDel(true)}>Delete my check-ins</button>}</div>
          {mine.length === 0 ? <p className="empty">No check-ins yet. Tap the microphone to make your first one.</p> :
            <ul className="timeline">{mine.map(m => <li key={m.id}><div className="when">{fmtTime(m.createdAt)}</div>
              <div className="what"><b>{m.destination || "Unknown place"}{m.state ? ", " + m.state : ""}</b><span className="small muted">{m.jobType || "—"} · {INTENT[m.intent]}{m.gps ? " · location shared" : ""}</span>
                {m.transcript && <div className="small muted" lang={m.lang.slice(0, 2)}>“{m.transcript}”</div>}</div>
              {m.photo && <img className="thumb" style={{ width:48, height:48 }} src={m.photo} alt="Site" />}
              <span className={"badge b-" + m.status} style={{ alignSelf:"flex-start" }}>{m.status === "queued" ? "Queued" : "Synced"}</span></li>)}</ul>}
        </div>
      </div>
    </div>
    {confirmDel && <Modal title="Delete all your check-ins?" onClose={() => setConfirmDel(false)}>
      <p className="muted">This removes every check-in of yours from this prototype’s database. It cannot be undone.</p>
      <div className="acts"><button className="btn ghost" onClick={() => setConfirmDel(false)}>Keep them</button><button className="btn danger" onClick={eraseMine}>Delete</button></div></Modal>}
  </div></div>;
}

/* =====================================================================
   Complaint desk
   ===================================================================== */
const CATS = ["Wages unpaid","Unsafe working conditions","Harassment","Accommodation or food","eShram card / UAN issue","Other"];
function Complaints() {
  const { user, data, reload, toast } = useApp();
  const [f, setF] = useState({ category:CATS[0], description:"", location:"" }); const [photo, setPhoto] = useState(null); const [busy, setBusy] = useState(false); const [last, setLast] = useState(null); const [err, setErr] = useState("");
  const [listening, setListening] = useState(false);
  const rec = useRef();

  const [aiPrompt, setAiPrompt] = useState("");

  const startListenComplaint = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast("Voice input needs Chrome or Edge.");
    if (listening) { rec.current && rec.current.stop(); return; }

    // Speak initial question
    const qText = "आपकी क्या शिकायत है?";
    setAiPrompt("🤖 AI: " + qText);
    speak(qText, "hi-IN");

    setTimeout(() => {
      const r = new SR(); r.lang = "hi-IN"; r.interimResults = true; r.continuous = false;
      let transcribedText = "";
      r.onresult = (e) => {
        let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        transcribedText = t;
        const autoCat = detectCategoryFromText(t);
        setF(prev => ({ ...prev, description: t, ...(autoCat ? { category: autoCat } : {}) }));
      };
      r.onerror = (e) => { setListening(false); toast("Voice error: " + e.error); };
      r.onend = async () => {
        setListening(false);
        if (!transcribedText.trim()) return;

        // Auto-extract category & location from speech
        const autoCat = detectCategoryFromText(transcribedText);
        let currentLoc = f.location;
        if (!currentLoc) {
          const foundGeo = await extractLocationFromText(transcribedText);
          if (foundGeo) {
            currentLoc = foundGeo.name + (foundGeo.state ? ", " + foundGeo.state : "");
          }
        }

        setF(prev => ({
          ...prev,
          ...(autoCat ? { category: autoCat } : {}),
          ...(currentLoc ? { location: currentLoc } : {})
        }));

        // Check if location is still missing
        if (!currentLoc.trim()) {
          const locPrompt = "कृपया स्थान या लोकेशन बताएं";
          setAiPrompt("🤖 AI: " + locPrompt);
          speak(locPrompt, "hi-IN");
          toast("Please enter or speak your location.");
        } else {
          const successMsg = "आपकी शिकायत दर्ज कर ली गई है।";
          setAiPrompt("🤖 AI: " + successMsg);
          speak(successMsg, "hi-IN");
          toast("Compliant details verified by AI assistant.");
        }
      };
      rec.current = r; r.start(); setListening(true);
    }, 1600);
  };

  const submit = async (e) => {
    e.preventDefault(); setErr("");
    if (f.description.trim().length < 15) return setErr("Please describe the problem in at least a sentence or two.");
    setBusy(true);
    const p = await checkPriority(f.description, f.category);
    if (f.userPriority && f.userPriority !== "Auto") {
      p.priority = f.userPriority;
      p.reason = "Priority selected by worker: " + f.userPriority + " (" + p.reason + ")";
    }
    const c = { id:"SS-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000), uan:user.uan, name:user.name, ...f, photo, createdAt:Date.now(), status:"Open", ...p };
    await DB.put("complaints", c); await reload(); setLast(c); setF({ category:CATS[0], description:"", location:"" }); setPhoto(null); setBusy(false);
  };
  const mine = data.complaints.filter(c => c.uan === user.uan).sort((a, b) => b.createdAt - a.createdAt);
  return <div className="page"><div className="wrap">
    <div className="page-head"><div><h2>Complaint desk</h2><p>Tell us what went wrong. Urgent cases are flagged for an officer straight away.</p></div></div>
    <div className="cols even">
      <div className="panel"><h3>New complaint</h3>
        <form onSubmit={submit} style={{ marginTop:12 }}>
          {aiPrompt && <div style={{ background: "var(--navy-3)", color: "var(--navy)", padding: "8px 12px", borderRadius: "var(--r-sm)", marginBottom: "12px", fontWeight: "600", fontSize: ".88rem", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>{aiPrompt}</span>
            <ReadAloud text={aiPrompt.replace("🤖 AI: ", "")} lang="hi-IN" />
          </div>}
          <div className="field"><label htmlFor="c">What is the problem about?</label><select id="c" value={f.category} onChange={e => setF({ ...f, category:e.target.value })}>{CATS.map(c => <option key={c}>{c}</option>)}</select></div>
          <div className="field"><label htmlFor="pr">Urgency Level (Self-Assessed)</label>
            <select id="pr" value={f.userPriority || "Auto"} onChange={e => setF({ ...f, userPriority:e.target.value })}>
              <option value="Auto">Auto-detect via AI / Rules</option>
              <option value="Critical">Critical (Immediate Danger / Safety / Confinement)</option>
              <option value="High">High (Unpaid Wages / Harassment / Shelter)</option>
              <option value="Medium">Medium (eShram / UAN Card / Benefit issue)</option>
              <option value="Low">Low (General Query / Feedback)</option>
            </select>
          </div>
          <div className="field">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "4px" }}>
              <label htmlFor="ds" style={{ margin: 0 }}>What happened?</label>
              <button type="button" className={"btn " + (listening ? "danger" : "ghost") + " sm"} onClick={startListenComplaint} style={{ padding: "4px 10px", fontSize: ".82rem" }}>
                <Icon n="mic" /> {listening ? "Listening…" : "🎙️ Speak Complaint"}
              </button>
            </div>
            <textarea id="ds" value={f.description} onChange={e => {
              const text = e.target.value;
              const cat = detectCategoryFromText(text);
              setF(prev => ({ ...prev, description: text, ...(cat ? { category: cat } : {}) }));
            }} placeholder="Say when, where and who was involved. You can speak or write in any language." />
          </div>
          <div className="field"><label htmlFor="lc">Where (city / site)</label><input id="lc" value={f.location} onChange={e => setF({ ...f, location:e.target.value })} placeholder="Surat, GJ — Vesu construction site" /></div>
          <div className="field"><label>Photo or evidence (optional)</label><PhotoField photo={photo} setPhoto={setPhoto} /></div>
          {err && <p className="err">{err}</p>}
          <button className="btn accent" disabled={busy}>{busy ? "Checking urgency…" : "Submit complaint"}</button>
        </form>
        {last && <div className="hint" style={{ marginTop:16, marginBottom:0, background:"var(--green-2)", color:"#12572F" }}>
          <b>Complaint {last.id} received.</b> Priority: <span className={"badge b-" + last.priority}>{last.priority}</span>
          <div style={{ marginTop:6 }}>{last.reason} Sent to: {last.department}.</div>
          {last.priority === "Critical" && <div style={{ marginTop:6 }}><b>If you are in danger now, call <a href="tel:112">112</a>.</b></div>}</div>}
      </div>
      <div className="panel"><h3>Your complaints</h3>
        {mine.length === 0 ? <p className="empty">You have not filed any complaints.</p> :
          <ul className="timeline">{mine.map(c => <li key={c.id}><div className="what"><b>{c.id} · {c.category}</b>
            <span className="small muted">{fmtTime(c.createdAt)} · {c.location || "no location"}</span>
            <div className="small" style={{ margin:"4px 0" }}>{c.description}</div>
            <span className={"badge b-" + c.priority}>{c.priority}</span> <span className={"badge b-" + (c.status === "In review" ? "review" : c.status)}>{c.status}</span>
            <div className="small muted" style={{ marginTop:4 }}>Priority set by {c.source}: {c.reason}</div></div>
            {c.photo && <img className="thumb" style={{ width:48, height:48 }} src={c.photo} alt="Evidence" />}</li>)}</ul>}
      </div>
    </div>
  </div></div>;
}

const FAQ_LIST = [
  { q: "What is a UAN (Universal Account Number)?", a: "UAN is a unique 12-digit number assigned to every unorganised worker registered on the eShram portal. It remains valid across all Indian states throughout your lifetime." },

const FAQ = [
  [/uan|register|card|e-?shram/i, "Your UAN is the 12-digit Universal Account Number on your e-Shram card. It stays the same across states. To register or fix details, visit eshram.gov.in or call the e-Shram helpline 14434."],
  [/wage|salary|paid|pay/i, "If wages are unpaid, note the employer name, site and dates, then file a complaint in the Complaint desk. You can also call the e-Shram helpline 14434 or approach your District Labour Office."],
  [/danger|threat|violence|beat|trapped|emergency/i, "If you are in danger, call 112 right now. For women in distress call 181, and for children 1098."],
  [/location|privacy|gps|track/i, "Shram Sanchar never tracks you continuously. Location is read only when you turn on check-in for a trip and confirm a check-in, and it is rounded to about 1 km. You can delete your check-ins anytime."],
];
function Chat() {
  const { user } = useApp();
  const [open, setOpen] = useState(false); const [busy, setBusy] = useState(false); const [q, setQ] = useState("");
  const [msgs, setMsgs] = useState([{ role:"bot", text:"Namaste! I can help with eShram, your check-ins, wages and complaints. Ask in any language." }]);
  const end = useRef();
  useEffect(() => { end.current && end.current.scrollIntoView({ block:"end" }); }, [msgs, open]);
  const send = async (text) => {
    text = (text ?? q).trim(); if (!text || busy) return; setQ(""); const next = [...msgs, { role:"me", text }]; setMsgs(next); setBusy(true);
    const system = `You are the Shram Sanchar assistant for Indian migrant and unorganised workers using the eShram portal. Reply in the same language the user writes in, in short, plain, respectful sentences (max 5 lines). Help with: eShram/UAN registration and updates, how check-ins work (opt-in, milestone-based, offline-first, consent-first), unpaid wages, workplace safety, and filing a complaint in this app's Complaint desk. For emergencies say call 112; e-Shram helpline is 14434; women helpline 181; Childline 1098. Never invent scheme amounts, dates or legal claims — if unsure, point to eshram.gov.in or the helpline. ${user ? "The user's name is " + user.name + "." : ""}`;
    try {
      const contents = next.filter((m, i) => i > 0).map(m => ({ role: m.role === "me" ? "user" : "model", parts:[{ text:m.text }] }));
      const reply = await gemini({ system, contents });
      setMsgs(m => [...m, { role:"bot", text: reply || "Sorry, I could not answer that." }]);
    } catch (e) {
      const hit = FAQ.find(x => x[0].test(text));
      setMsgs(m => [...m, { role:"bot", text: (hit ? hit[1] : "For any eShram question, call the helpline 14434 or visit eshram.gov.in.") }]);
    }
    setBusy(false);
  };
  return <>
    {open && <div className="chat" role="dialog" aria-label="Assistant">
      <header><b>Shram Sahayak</b><button onClick={() => setOpen(false)} aria-label="Close chat"><Icon n="x" /></button></header>
      <div className="msgs">{msgs.map((m, i) => <div key={i} className={"msg " + m.role}>{m.text}</div>)}{busy && <div className="msg bot">Thinking…</div>}<div ref={end} /></div>
      {msgs.length < 3 && <div className="chips">{["What is a UAN?","My wages are unpaid","Is my location tracked?"].map(s => <button key={s} onClick={() => send(s)}>{s}</button>)}</div>}
      <form onSubmit={e => { e.preventDefault(); send(); }}><input value={q} onChange={e => setQ(e.target.value)} placeholder="Type your question" aria-label="Your question" /><button className="btn primary sm" disabled={busy} aria-label="Send"><Icon n="send" /></button></form>
    </div>}
    <button className="chat-fab" onClick={() => setOpen(!open)} aria-label="Open assistant"><Icon n={open ? "x" : "chat"} /></button>
  </>;
}
function SettingsModal({ onClose }) {
  const { toast } = useApp(); const s = getSettings();
  const [key, setKey] = useState(s.geminiKey || ""); const [model, setModel] = useState(s.model || GEMINI_MODEL_DEFAULT); const [testing, setTesting] = useState(false);
  const save = () => { localStorage.setItem("ss_settings", JSON.stringify({ geminiKey:key.trim(), model:model.trim() || GEMINI_MODEL_DEFAULT })); toast("AI settings saved."); onClose(); };
  const test = async () => {
    localStorage.setItem("ss_settings", JSON.stringify({ geminiKey:key.trim(), model:model.trim() || GEMINI_MODEL_DEFAULT })); setTesting(true);
    try { const t = await gemini({ contents:[{ role:"user", parts:[{ text:"Reply with the single word: ready" }] }] }); toast("Gemini says: " + t.trim().slice(0, 40)); }
    catch (e) { toast("Test failed: " + e.message); } setTesting(false);
  };
  const reset = async () => { if (!confirm("Erase all demo data and start over?")) return; indexedDB.deleteDatabase("shram-sanchar"); localStorage.removeItem("ss_seeded"); localStorage.removeItem("ss_consent"); location.reload(); };
  return <Modal title="AI settings" onClose={onClose}>
    <p className="small muted" style={{ marginBottom:12 }}>Gemini powers the chat assistant, voice-text understanding and complaint priority check. The key stays in this browser only. Without it, the app falls back to simple on-device rules.</p>
    <div className="field"><label htmlFor="k">Gemini API key</label><input id="k" type="password" value={key} onChange={e => setKey(e.target.value)} placeholder="Paste your key" autoComplete="off" /></div>
    <div className="field"><label htmlFor="mo">Model</label><input id="mo" value={model} onChange={e => setModel(e.target.value)} /></div>
    <div className="acts"><button className="btn danger sm" onClick={reset} style={{ marginRight:"auto" }}>Reset demo data</button>
      <button className="btn ghost" onClick={test} disabled={testing || !key.trim()}>{testing ? "Testing…" : "Test key"}</button><button className="btn primary" onClick={save}>Save</button></div>
  </Modal>;
}

function ContractorLogin() {
  const { setUser, toast } = useApp();
  const [tab, setTab] = useState("login");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  // Login form state
  const [lf, setLf] = useState({ mobile:"", password:"" });
  const setL = k => e => setLf({ ...lf, [k]: e.target.value });

  // Registration form state
  const [rf, setRf] = useState({ name:"", company:"", mobile:"", email:"", password:"", confirmPw:"", city:"", state:"GJ", gst:"", description:"" });
  const setR = k => e => setRf({ ...rf, [k]: e.target.value });

  const doLogin = async (e) => {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const res = await fetch("/api/contractor/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ mobile: lf.mobile, password: lf.password }) });
      const data = await res.json();
      if (!res.ok) { setErr(data.error || "Login failed."); setBusy(false); return; }
      const u = { role:"contractor", name: data.contractor.name, contractorId: data.contractor.id, verified: data.contractor.verified, ...data.contractor };
      localStorage.setItem("ss_user", JSON.stringify(u));
      setUser(u);
      toast("Welcome, " + data.contractor.name + "!");
      go("contractor");
    } catch { setErr("Network error. Try again."); }
    setBusy(false);
  };

  const doRegister = async (e) => {
    e.preventDefault(); setErr(""); setBusy(true);
    if (rf.password !== rf.confirmPw) { setErr("Passwords do not match."); setBusy(false); return; }
    if (rf.password.length < 6) { setErr("Password must be at least 6 characters."); setBusy(false); return; }
    try {
      const body = { name: rf.name, company: rf.company, mobile: rf.mobile, email: rf.email, password: rf.password, city: rf.city, state: rf.state, gst: rf.gst, description: rf.description };
      const res = await fetch("/api/contractor/register", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { setErr(data.error || "Registration failed."); setBusy(false); return; }
      toast("Registered! Admin will review your account. Demo OTP skipped.");
      const u = { role:"contractor", name: data.contractor.name, contractorId: data.contractor.id, verified: false, ...data.contractor };
      localStorage.setItem("ss_user", JSON.stringify(u));
      setUser(u);
      go("contractor");
    } catch { setErr("Network error. Try again."); }
    setBusy(false);
  };

  return <div className="page"><div className="wrap"><div className="contractor-reg panel">
    <h2 style={{ marginBottom:14 }}>Contractor Portal</h2>
    <div className="hint">Demo credentials — Login: mobile <b>9876543210</b>, password <b>demo123</b> (verified) &nbsp;|&nbsp; mobile <b>9001234567</b> (Nashik farm, verified) &nbsp;|&nbsp; mobile <b>9123456789</b> (pending admin review)</div>
    <div className="tabs">{[["login","Log in"],["register","Register"]].map(([k, l]) => <button key={k} className={tab === k ? "on" : ""} onClick={() => { setTab(k); setErr(""); }}>{l}</button>)}</div>

    {tab === "login" && <form onSubmit={doLogin}>
      <div className="field"><label htmlFor="cl-mob">Mobile number</label><input id="cl-mob" inputMode="numeric" maxLength={10} value={lf.mobile} onChange={setL("mobile")} placeholder="10-digit mobile" required /></div>
      <div className="field"><label htmlFor="cl-pw">Password</label><input id="cl-pw" type="password" value={lf.password} onChange={setL("password")} required /></div>
      {err && <p className="err">{err}</p>}
      <button className="btn primary" style={{ width:"100%" }} disabled={busy}>{busy ? "Logging in…" : "Log in"}</button>
    </form>}

    {tab === "register" && <form onSubmit={doRegister}>
      <div className="row">
        <div className="field"><label htmlFor="cr-name">Your name *</label><input id="cr-name" value={rf.name} onChange={setR("name")} required /></div>
        <div className="field"><label htmlFor="cr-co">Company name *</label><input id="cr-co" value={rf.company} onChange={setR("company")} required /></div>
      </div>
      <div className="row">
        <div className="field"><label htmlFor="cr-mob">Mobile *</label><input id="cr-mob" inputMode="numeric" maxLength={10} value={rf.mobile} onChange={setR("mobile")} required /></div>
        <div className="field"><label htmlFor="cr-email">Email</label><input id="cr-email" type="email" value={rf.email} onChange={setR("email")} placeholder="Optional — improves trust score" /></div>
      </div>
      <div className="row">
        <div className="field"><label htmlFor="cr-city">City *</label><input id="cr-city" value={rf.city} onChange={setR("city")} required /></div>
        <div className="field"><label htmlFor="cr-st">State *</label><select id="cr-st" value={rf.state} onChange={setR("state")}>{STATES_LIST.map(([n, c]) => <option key={c} value={c}>{n}</option>)}</select></div>
      </div>
      <div className="field"><label htmlFor="cr-gst">GST number <span className="muted small">(improves Gemini trust score)</span></label><input id="cr-gst" value={rf.gst} onChange={setR("gst")} placeholder="e.g. 27AAPFU0939F1ZV" /></div>
      <div className="field"><label htmlFor="cr-desc">About your company / work</label><textarea id="cr-desc" value={rf.description} onChange={setR("description")} placeholder="Describe the type of work, locations, and worker conditions..." /></div>
